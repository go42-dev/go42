---

# Prefer the immutable digest published with a GitHub release. When digest
# is empty, tag is required instead.
image:
  repository: ghcr.io/go42-dev/go42
  tag: ""
  digest: ""
  pullPolicy: Always

imagePullSecrets: {}

nodeSelector: {}
affinity: {}
tolerations: {}

replicaCount: 1

# Allow more time than the startup probe budget for the rollout to make progress.
# Set deployment tooling's wait timeout accordingly (for example, Helm --timeout 20m).
progressDeadlineSeconds: 1200

# Allow up to 15 minutes for migrations and dependency initialization.
# Increase both this budget (periodSeconds * failureThreshold) and the progress
# deadline for longer startup times. Probing succeeds as soon as /health responds.
startupProbe:
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 180

resources:
  requests:
    cpu: 500m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 256Mi

service:
  httpPort: 8080
  grpcPort: 50051

env:
  ENVIRONMENT: development
  LOG_LEVEL: debug
  DATABASE_ENGINE: sqlite
  DATABASE_SQLITE_MODE: rwc
  DATABASE_SQLITE_PATH: /data/go42.db
  SERVER_HTTP_LISTEN: ":8080"
  SERVER_GRPC_LISTEN: ":50051"

persistence:
  enabled: true
  existingClaim: ""
  storageClass: standard
  accessModes:
    - ReadWriteOnce
  size: 100Mi
