---

# Prefer the immutable digest published with a GitHub release. When digest
# is empty, tag is required instead.
image:
  repository: ghcr.io/go42-dev/go42
  tag: ""
  digest: ""
  pullPolicy: Always

imagePullSecrets: {}

nodeSelector: {}
affinity: {}
tolerations: {}

replicaCount: 1

resources:
  requests:
    cpu: 500m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 256Mi

service:
  httpPort: 8080
  grpcPort: 50051

env:
  ENVIRONMENT: development
  LOG_LEVEL: debug
  DATABASE_ENGINE: sqlite
  DATABASE_SQLITE_MODE: rwc
  DATABASE_SQLITE_PATH: /data/go42.db
  SERVER_HTTP_LISTEN: ":8080"
  SERVER_GRPC_LISTEN: ":50051"

persistence:
  enabled: true
  existingClaim: ""
  storageClass: standard
  accessModes:
    - ReadWriteOnce
  size: 100Mi
