---

name: load-tests-report

# Generates a summary from K6 artifacts uploaded by the load-test matrix.

on:
  workflow_call:
    inputs:
      runs_on:
        required: true
        type: string
      timeout_minutes:
        required: false
        type: number
        default: 10

permissions: {}

jobs:
  report:
    name: report
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Download K6 test results'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: k6-summary-*
          merge-multiple: true
      - name: 'Generate load test report'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |-
            const fs = require('fs');
            const path = require('path');

            // Read all k6 summary files
            const files = fs.readdirSync('.').filter(f => f.startsWith('k6-summary-') && f.endsWith('.json'));

            let allResults = [];

            for (const file of files) {
              const match = file.match(/k6-summary-(\w+)-(\w+)-v1\.json/);
              if (!match) continue;

              const [_, protocol, database] = match;
              const results = JSON.parse(fs.readFileSync(file, 'utf8'));

              // The legacy summary export marks failed thresholds with true.
              const failedThresholds = Object.entries(results.metrics).flatMap(([metric, data]) =>
                Object.entries(data.thresholds || {})
                  .filter(([, failed]) => failed)
                  .map(([expression]) => `${metric}: ${expression}`));
              allResults.push({ protocol, database, results, failedThresholds });
            }

            // Sort results for consistent output
            allResults.sort((a, b) => {
              if (a.protocol !== b.protocol) return a.protocol.localeCompare(b.protocol);
              return a.database.localeCompare(b.database);
            });

            // Generate GitHub Job Summary
            let summary = '# 🚀 Load Test Results Summary\n\n';

            // Create a summary table
            summary += '| Protocol | Database | Result | VUs Max | Total Requests | Avg Response | P95 Response | Success Rate |\n';
            summary += '|----------|----------|--------|---------|----------------|--------------|--------------|-------------|\n';

            for (const { protocol, database, results, failedThresholds } of allResults) {
              const outcome = failedThresholds.length > 0 ? 'FAIL' : 'PASS';
              if (protocol === 'http') {
                const vusMax = results.metrics.vus_max?.value || 'N/A';
                const httpReqsCount = results.metrics.http_reqs?.count || 0;
                const httpReqsRate = results.metrics.http_reqs?.rate || 0;
                const httpReqDurationAvg = results.metrics.http_req_duration?.avg || 0;
                const httpReqDurationP95 = results.metrics.http_req_duration?.['p(95)'] || 0;
                const successRate = (results.metrics.success_rate?.value || 0) * 100;

                summary += `| HTTP | ${database} | ${outcome} | ${vusMax} | ${httpReqsCount} (${httpReqsRate.toFixed(2)}/s) | ${httpReqDurationAvg.toFixed(2)}ms | ${httpReqDurationP95.toFixed(2)}ms | ${successRate.toFixed(2)}% |\n`;
              } else if (protocol === 'grpc') {
                const vusMax = results.metrics.vus_max?.value || 'N/A';
                const grpcReqsCount = results.metrics.operations?.count || 0;
                const grpcReqsRate = results.metrics.operations?.rate || 0;
                const grpcReqDurationAvg = results.metrics.grpc_req_duration?.avg || 0;
                const grpcReqDurationP95 = results.metrics.grpc_req_duration?.['p(95)'] || 0;
                const successRate = (results.metrics.success_rate?.value || 0) * 100;

                summary += `| gRPC | ${database} | ${outcome} | ${vusMax} | ${grpcReqsCount} (${grpcReqsRate.toFixed(2)}/s) | ${grpcReqDurationAvg.toFixed(2)}ms | ${grpcReqDurationP95.toFixed(2)}ms | ${successRate.toFixed(2)}% |\n`;
              }
            }

            // Add detailed breakdowns
            summary += '\n## 📊 Detailed Results\n\n';

            for (const { protocol, database, results, failedThresholds } of allResults) {
              summary += `<details>\n<summary><b>${protocol.toUpperCase()} - ${database}</b></summary>\n\n`;
              if (failedThresholds.length > 0) {
                summary += 'Failed thresholds:\n\n';
                summary += failedThresholds.map(threshold => `- \`${threshold}\``).join('\n') + '\n\n';
              }

              if (protocol === 'http') {
                const vusMax = results.metrics.vus_max?.value || 'N/A';
                const vusMin = results.metrics.vus?.min || 0;
                const vusMaxRange = results.metrics.vus?.max || 0;
                const httpReqsCount = results.metrics.http_reqs?.count || 0;
                const httpReqsRate = results.metrics.http_reqs?.rate || 0;
                const httpReqDurationAvg = results.metrics.http_req_duration?.avg || 0;
                const httpReqDurationMed = results.metrics.http_req_duration?.med || 0;
                const httpReqDurationMin = results.metrics.http_req_duration?.min || 0;
                const httpReqDurationMax = results.metrics.http_req_duration?.max || 0;
                const httpReqDurationP90 = results.metrics.http_req_duration?.['p(90)'] || 0;
                const httpReqDurationP95 = results.metrics.http_req_duration?.['p(95)'] || 0;
                const requestFailures = results.metrics.success_rate?.fails || 0;
                const checksPasses = results.metrics.checks?.passes || 0;
                const checksFails = results.metrics.checks?.fails || 0;
                const successRate = (results.metrics.success_rate?.value || 0) * 100;

                summary += '| Metric | Value |\n';
                summary += '|--------|-------|\n';
                summary += `| **Virtual Users** | |\n`;
                summary += `| Maximum | ${vusMax} |\n`;
                summary += `| Range | ${vusMin} - ${vusMaxRange} |\n`;
                summary += `| **Requests** | |\n`;
                summary += `| Total | ${httpReqsCount} |\n`;
                summary += `| Rate | ${httpReqsRate.toFixed(2)}/sec |\n`;
                summary += `| Failed | ${requestFailures} |\n`;
                summary += `| Success Rate | ${successRate.toFixed(2)}% |\n`;
                summary += `| Connection Errors | ${results.metrics.connection_errors?.count || 0} |\n`;
                summary += `| **Response Times** | |\n`;
                summary += `| Min | ${httpReqDurationMin.toFixed(2)}ms |\n`;
                summary += `| Median | ${httpReqDurationMed.toFixed(2)}ms |\n`;
                summary += `| Average | ${httpReqDurationAvg.toFixed(2)}ms |\n`;
                summary += `| P90 | ${httpReqDurationP90.toFixed(2)}ms |\n`;
                summary += `| P95 | ${httpReqDurationP95.toFixed(2)}ms |\n`;
                summary += `| Max | ${httpReqDurationMax.toFixed(2)}ms |\n`;
                summary += `| **Checks** | |\n`;
                summary += `| Passed | ${checksPasses} |\n`;
                summary += `| Failed | ${checksFails} |\n`;
              } else if (protocol === 'grpc') {
                const vusMax = results.metrics.vus_max?.value || 'N/A';
                const vusMin = results.metrics.vus?.min || 0;
                const vusMaxRange = results.metrics.vus?.max || 0;
                const grpcReqsCount = results.metrics.operations?.count || 0;
                const grpcReqsRate = results.metrics.operations?.rate || 0;
                const grpcReqDurationAvg = results.metrics.grpc_req_duration?.avg || 0;
                const grpcReqDurationMed = results.metrics.grpc_req_duration?.med || 0;
                const grpcReqDurationMin = results.metrics.grpc_req_duration?.min || 0;
                const grpcReqDurationMax = results.metrics.grpc_req_duration?.max || 0;
                const grpcReqDurationP90 = results.metrics.grpc_req_duration?.['p(90)'] || 0;
                const grpcReqDurationP95 = results.metrics.grpc_req_duration?.['p(95)'] || 0;
                const requestFailures = results.metrics.success_rate?.fails || 0;
                const checksPasses = results.metrics.checks?.passes || 0;
                const checksFails = results.metrics.checks?.fails || 0;
                const successRate = (results.metrics.success_rate?.value || 0) * 100;

                summary += '| Metric | Value |\n';
                summary += '|--------|-------|\n';
                summary += `| **Virtual Users** | |\n`;
                summary += `| Maximum | ${vusMax} |\n`;
                summary += `| Range | ${vusMin} - ${vusMaxRange} |\n`;
                summary += `| **Requests** | |\n`;
                summary += `| Total | ${grpcReqsCount} |\n`;
                summary += `| Rate | ${grpcReqsRate.toFixed(2)}/sec |\n`;
                summary += `| Failed | ${requestFailures} |\n`;
                summary += `| Success Rate | ${successRate.toFixed(2)}% |\n`;
                summary += `| Connection Errors | ${results.metrics.connection_errors?.count || 0} |\n`;
                summary += `| **Response Times** | |\n`;
                summary += `| Min | ${grpcReqDurationMin.toFixed(2)}ms |\n`;
                summary += `| Median | ${grpcReqDurationMed.toFixed(2)}ms |\n`;
                summary += `| Average | ${grpcReqDurationAvg.toFixed(2)}ms |\n`;
                summary += `| P90 | ${grpcReqDurationP90.toFixed(2)}ms |\n`;
                summary += `| P95 | ${grpcReqDurationP95.toFixed(2)}ms |\n`;
                summary += `| Max | ${grpcReqDurationMax.toFixed(2)}ms |\n`;
                summary += `| **Checks** | |\n`;
                summary += `| Passed | ${checksPasses} |\n`;
                summary += `| Failed | ${checksFails} |\n`;
              }

              summary += '\n</details>\n\n';
            }

            // Write to GitHub Step Summary
            await core.summary
              .addRaw(summary)
              .write();
