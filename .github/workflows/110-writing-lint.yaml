---

name: writing-lint

# Markdown linter.
# @see https://github.com/errata-ai/vale

on:
  workflow_call:
    inputs:
      runs_on:
        required: true
        type: string
      continue_on_error:
        required: true
        type: boolean
      timeout_minutes:
        required: false
        type: number
        default: 10

permissions: {}

jobs:
  writing-lint:
    name: writing-lint
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    # ----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Run Vale prose linter'
        uses: errata-ai/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          version: '3.18.0' # Keep in sync with etc/mise.toml.
          fail_on_error: true
          files: '["README.md","docs/adr","docs/brd","docs/core","internal/","cmd/","pkg/","tests/"]'
          vale_flags: "--config etc/vale.ini"
