---

name: fuzz-tests

on:
  workflow_call:
    inputs:
      runs_on:
        required: false
        type: string
        default: ubuntu-latest
      fuzz_time:
        required: false
        type: string
        default: 30s
  workflow_dispatch:
    inputs:
      fuzz_time:
        description: Fuzzing duration per target (Go duration, such as 5m)
        required: true
        type: string
        default: 5m

permissions: {}

jobs:
  fuzz-tests:
    name: fuzz-tests
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      FUZZ_TIME: ${{ inputs.fuzz_time || '5m' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        id: setup-go
        uses: ./.github/actions/setup-go
        with:
          cache-scope: fuzz-tests
      - name: Restore and save fuzz corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup-go.outputs.go-build }}/fuzz
          # A new key lets successful runs save newly discovered inputs.
          key: fuzz-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod') }}-${{ github.run_id }}-${{ github.run_attempt
            }}
          restore-keys: |
            fuzz-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod') }}-
      - name: Install pinned Task
        uses: ./.github/actions/setup-tools
      - name: Fuzz all targets
        run: task --exit-code test:fuzz
      - name: Upload failing corpus for reproduction
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures-${{ github.run_attempt }}
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
          retention-days: 7
