---

name: fuzz-tests

on:
  workflow_call:
    inputs:
      runs_on:
        required: false
        type: string
        default: ubuntu-latest
      fuzz_time:
        required: false
        type: string
        default: 30s
  workflow_dispatch:
    inputs:
      fuzz_time:
        description: Fuzzing duration per target (Go duration, such as 5m)
        required: true
        type: string
        default: 5m

permissions: {}

jobs:
  fuzz-tests:
    name: fuzz-tests
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      FUZZ_TIME: ${{ inputs.fuzz_time || '5m' }}
      MISE_DEFAULT_CONFIG_FILENAME: etc/mise.toml
      MISE_DATA_DIR: ${{ github.workspace }}/.tools
      MISE_CACHE_DIR: ${{ github.workspace }}/.tools/cache
      MISE_STATE_DIR: ${{ github.workspace }}/.tools/state
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Get Go cache paths
        id: go-cache
        shell: bash
        run: |
          {
            echo "go-build=$(go env GOCACHE)"
            echo "go-mod=$(go env GOMODCACHE)"
          } >> "$GITHUB_OUTPUT"
      - name: Restore and save Go caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        env:
          GO_CACHE_PREFIX: go-tests-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ github.job
            }}
        with:
          # Cache build entries without the separately managed fuzz corpus.
          path: |
            ${{ steps.go-cache.outputs.go-build }}/*
            !${{ steps.go-cache.outputs.go-build }}/fuzz
            ${{ steps.go-cache.outputs.go-mod }}
          # Refresh per commit and reuse earlier builds from this job.
          key: ${{ env.GO_CACHE_PREFIX }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ env.GO_CACHE_PREFIX }}-${{ hashFiles('go.mod', 'go.sum') }}-
            ${{ env.GO_CACHE_PREFIX }}-
      - name: Restore and save fuzz corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache.outputs.go-build }}/fuzz
          # A new key lets successful runs save newly discovered inputs.
          key: fuzz-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod') }}-${{ github.run_id }}-${{ github.run_attempt
            }}
          restore-keys: |
            fuzz-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod') }}-
      - name: Install pinned Task
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.9.1'
          install_args: --locked task
      - name: Fuzz all targets
        run: task --exit-code test-fuzz
      - name: Upload failing corpus for reproduction
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-failures-${{ github.run_attempt }}
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
          retention-days: 7
