---

name: copilot-setup-steps

# This workflow is responsible for setting up the environment for Copilot.

on:
  workflow_dispatch:

permissions: {}

jobs:
  copilot-setup-steps:
    name: copilot-setup-steps
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/ai-prepare-env
      # -----
      - name: 'Build agent instructions'
        run: task x -- agentenv generate --providers=copilot
        shell: bash
