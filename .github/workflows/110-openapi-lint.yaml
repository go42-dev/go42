---

name: openapi-lint

# OpenAPI validation and compatibility checks.
# @see https://redocly.com/docs/cli

on:
  workflow_call:
    inputs:
      runs_on:
        required: true
        type: string
      continue_on_error:
        required: true
        type: boolean
      timeout_minutes:
        required: false
        type: number
        default: 10

permissions: {}

jobs:
  openapi-lint:
    name: openapi-lint
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    env:
      OPENAPI_BASE_REF: >-
        ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before)
        || 'HEAD^' }}
    # ----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Include the PR base and previous push for compatibility checks.
      - name: 'Run redocly OpenAPI linter'
        run: |-
          docker run --rm \
            -v "${{ github.workspace }}:/workdir" \
            -w /workdir \
            ghcr.io/redocly/cli:2.51.2@sha256:2dcc3939c2180e1da96db06a40aa079cb32c4ef3bac8b35ff061f2140322da64 \
            lint --config etc/redocly.yaml --format github-actions api/openapi/**/*.yaml
      - name: Reject breaking OpenAPI changes
        uses: oasdiff/oasdiff-action/breaking@9c0494cfee8b8fcc9fb383ed2d5d3fbdae169b93 # v0.1.15 (oasdiff v1.31.0)
        with:
          base: '${{ env.OPENAPI_BASE_REF }}:api/openapi/v1/.combined.yaml'
          revision: api/openapi/v1/.combined.yaml
          fail-on: ERR
          review: 'false'
          github-token: ''
