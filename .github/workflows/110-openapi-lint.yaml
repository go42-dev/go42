---

name: openapi-lint

# OpenAPI validation and compatibility checks.
# @see https://redocly.com/docs/cli

on:
  workflow_call:
    inputs:
      runs_on:
        required: true
        type: string
      continue_on_error:
        required: true
        type: boolean
      timeout_minutes:
        required: false
        type: number
        default: 10

permissions: {}

jobs:
  openapi-lint:
    name: openapi-lint
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    env:
      MISE_DEFAULT_CONFIG_FILENAME: etc/mise.toml
      MISE_DATA_DIR: ${{ github.workspace }}/.tools
      MISE_CACHE_DIR: ${{ github.workspace }}/.tools/cache
      MISE_STATE_DIR: ${{ github.workspace }}/.tools/state
    # ----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Include the PR base and previous push for compatibility checks.
      - name: 'Run redocly OpenAPI linter'
        run: |-
          docker run --rm \
            -v "${{ github.workspace }}:/workdir" \
            -w /workdir \
            ghcr.io/redocly/cli:2.51.2@sha256:2dcc3939c2180e1da96db06a40aa079cb32c4ef3bac8b35ff061f2140322da64 \
            lint --config etc/redocly.yaml --format github-actions api/openapi/**/*.yaml
      - name: Install pinned oasdiff
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.9.1'
          install_args: --locked github:oasdiff/oasdiff
          cache_key_prefix: mise-oasdiff
      - name: Reject breaking OpenAPI changes
        env:
          OPENAPI_BASE_REF: >-
            ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' &&
            github.event.before) || 'HEAD^' }}
        run: |-
          oasdiff breaking --fail-on ERR --format githubactions \
            "$OPENAPI_BASE_REF:api/openapi/v1/.combined.yaml" api/openapi/v1/.combined.yaml
