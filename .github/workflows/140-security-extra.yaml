---

name: security-extra

# Vulnerability scan of final artifacts.
# @see https://trivy.dev/latest/
# @see https://www.zaproxy.org/
# Go call reachability is checked by govulncheck in 130-security.yaml;
# an image SBOM does not contain the symbol data needed for that analysis.

on:
  workflow_call:
    inputs:
      runs_on:
        required: true
        type: string
      continue_on_error:
        required: true
        type: boolean
      image_reference:
        required: true
        type: string
      timeout_minutes:
        required: false
        type: number
        default: 15

permissions: {}

jobs:
  trivy:
    name: trivy-${{ matrix.arch }}
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    env:
      TRIVY_PLATFORM: linux/${{ matrix.arch }}
      TRIVY_IMAGE_SRC: remote
    # ----
    steps:
      - name: 'Validate image reference'
        env:
          IMAGE_REFERENCE: ${{ inputs.image_reference }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_REFERENCE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]; then
            echo 'image_reference must be an immutable GHCR digest reference' >&2
            exit 1
          fi
      # Registry authentication from the build job is not shared with this job.
      - name: 'Log in to GitHub Container Registry'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Keep every severity and unfixed finding visible in the advisory report.
      - name: 'Report all image vulnerabilities'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.image_reference }}
          scanners: vuln
          timeout: 10m
          format: 'table'
          version: v0.70.0
          exit-code: '0'
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
      # Highlight fixable high and critical findings. Callers keep this job advisory.
      - name: 'Report fixable high and critical image vulnerabilities (advisory)'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.image_reference }}
          scanners: vuln
          timeout: 10m
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true # fail only when remediation exists
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          skip-setup-trivy: true

  zap-api-scan:
    name: zap-api-scan
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
      packages: read
    # ----
    services:
      app:
        image: ${{ inputs.image_reference }}
        ports:
          # Let Docker select a free host port.
          - 8080/tcp
        env:
          LOG_LEVEL: warn
          ENVIRONMENT: ci-security-tests
          SERVER_HTTP_LISTEN: :8080
        options: >-
          --health-cmd "curl -f http://localhost:8080/health || exit 1" --health-start-period 1s --health-interval 5s --health-timeout
          5s --health-retries 10
    # ----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ----
      - name: 'Run ZAP API scan'
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        with:
          target: "http://localhost:${{ job.services.app.ports['8080'] }}/api/v1/.combined.yaml"
          format: openapi
          allow_issue_writing: false
