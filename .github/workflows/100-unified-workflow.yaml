---

name: unified-workflow

# Unified workflow - linting, testing, and security scanning.
# This workflow is designed for development and testing stages.
#
# Actions are executed by `runners` that are provided by GitHub.
# They are not free and billed per minute, 2000 minutes per month are free for private repositories.
# For public repositories, actions are free without limits. (common sense still applies)
# Besides actions, there are also storage limits for packages (like docker images).
#
# Running this workflow too often can ramp-up actions costs significantly.
# One way to mitigate this, is to use a self-hosted runners.
# @see https://docs.github.com/en/actions/hosting-your-own-runners
#
# @note `with` arguments are repeated because `with` does not support context
# @see https://github.com/orgs/community/discussions/25246
# May be fixed with https://github.com/marketplace/actions/dynamic-uses
#
# @tip to use output from job X in job Y, use `needs: [X]` in job Y

on:
  # manual trigger
  workflow_dispatch:
  # push or merge to master
  push:
    branches:
      - master
  # pull request targeting master branch created or updated
  pull_request:
    branches:
      - master

permissions: {}

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request' && format('unified-pr-{0}', github.event.pull_request.number) || format('unified-run-{0}-{1}',
    github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # stage 1: linting

  # Common entry point for every full CI run.
  gate-start:
    name: gate-start
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start full CI
        run: echo "Full CI started."

  git-lint:
    uses: ./.github/workflows/110-git-lint.yaml
    permissions:
      contents: read
      pull-requests: read
    needs:
      - gate-start
    with:
      runs_on: ubuntu-latest
      continue_on_error: false
      timeout_minutes: 10

  golangci-lint:
    uses: ./.github/workflows/110-golangci-lint.yaml
    permissions:
      contents: read
    needs:
      - gate-start
    with:
      runs_on: ubuntu-latest
      continue_on_error: false
      timeout_minutes: 10

  docker-lint:
    uses: ./.github/workflows/110-docker-lint.yaml
    permissions:
      contents: read
    needs:
      - gate-start
    with:
      runs_on: ubuntu-latest
      continue_on_error: false
      timeout_minutes: 10

  helm-lint:
    uses: ./.github/workflows/110-helm-lint.yaml
    permissions:
      contents: read
    needs:
      - gate-start
    with:
      runs_on: ubuntu-latest
      continue_on_error: false
      timeout_minutes: 10

  proto-lint:
    uses: ./.github/workflows/110-proto-lint.yaml
    permissions:
      contents: read
    needs:
      - gate-start
    with:
      runs_on: ubuntu-latest
      continue_on_error: false
      timeout_minutes: 10

  openapi-lint:
    uses: ./.github/workflows/110-openapi-lint.yaml
    permissions:
      contents: read
    needs:
      - gate-start
    with:
      runs_on: ubuntu-latest
      continue_on_error: false
      timeout_minutes: 10

  markdown-lint:
    uses: ./.github/workflows/110-markdown-lint.yaml
    permissions:
      contents: read
    needs:
      - gate-start
    with:
      runs_on: ubuntu-latest
      continue_on_error: false
      timeout_minutes: 10

  writing-lint:
    uses: ./.github/workflows/110-writing-lint.yaml
    permissions:
      contents: read
    needs:
      - gate-start
    with:
      runs_on: ubuntu-latest
      continue_on_error: false
      timeout_minutes: 10

  action-lint:
    uses: ./.github/workflows/110-action-lint.yaml
    permissions:
      contents: read
    needs:
      - gate-start
    with:
      runs_on: ubuntu-latest
      continue_on_error: false
      timeout_minutes: 10

  sql-lint:
    uses: ./.github/workflows/110-sql-lint.yaml
    permissions:
      contents: read
    needs:
      - gate-start
    with:
      runs_on: ubuntu-latest
      continue_on_error: false
      timeout_minutes: 10

  project-lint:
    uses: ./.github/workflows/110-project-lint.yaml
    permissions:
      contents: read
    needs:
      - gate-start
    with:
      runs_on: ubuntu-latest
      continue_on_error: false
      timeout_minutes: 10

  editorconfig-lint:
    uses: ./.github/workflows/110-editorconfig-lint.yaml
    permissions:
      contents: read
    needs:
      - gate-start
    with:
      runs_on: ubuntu-latest
      continue_on_error: false
      timeout_minutes: 10

  # stage 2: unit tests

  unit-tests:
    uses: ./.github/workflows/120-unit-tests.yaml
    permissions:
      contents: read
    needs:
      - git-lint
      - golangci-lint
      - docker-lint
      - helm-lint
      - proto-lint
      - openapi-lint
      - markdown-lint
      - writing-lint
      - action-lint
      - sql-lint
      - project-lint
      - editorconfig-lint
    with:
      runs_on: ubuntu-latest
      continue_on_error: false
      timeout_minutes: 10

  fuzz-tests:
    uses: ./.github/workflows/125-fuzz-tests.yaml
    permissions:
      contents: read
    needs:
      - git-lint
      - golangci-lint
      - docker-lint
      - helm-lint
      - proto-lint
      - openapi-lint
      - markdown-lint
      - writing-lint
      - action-lint
      - sql-lint
      - project-lint
      - editorconfig-lint
    with:
      runs_on: ubuntu-latest
      fuzz_time: 30s

  coverage-report:
    name: coverage-report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
    needs:
      - unit-tests
      - fuzz-tests
    steps:
      - name: 'Generate coverage report'
        id: coverage_report
        uses: fgrosse/go-coverage-report@e432de98ee94a276e8f666d25bfd76347665f75b # v1.3.1
        with:
          version: v1.3.1
          sha256sum: bce196efd0d22bbdcfa2ab45dc38ad40e96acc5802356b48be358a43958674a0
          coverage-artifact-name: code-coverage
          coverage-file-name: coverage.out
          root-package: github.com/go42-dev/go42
          trim: github.com/go42-dev/go42
          exclude: '(^|/)(api/gen|mocks)/'
          skip-comment: >-
            ${{ github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]' }}
      - name: 'Add coverage report to job summary'
        if: steps.coverage_report.outputs.coverage_report != ''
        run: printf '%s\n' "$COVERAGE_REPORT" >> "$GITHUB_STEP_SUMMARY"
        env:
          COVERAGE_REPORT: ${{ steps.coverage_report.outputs.coverage_report }}

  # stage 3: pre-build security scans

  security:
    uses: ./.github/workflows/130-security.yaml
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
    permissions:
      actions: read
      contents: read
      security-events: read
    needs:
      - unit-tests
    with:
      runs_on: ubuntu-latest
      continue_on_error: false
      timeout_minutes: 15
      codeql_timeout_minutes: 30

  # stage 4: build artifacts

  # since we are using ref name as image tag, we need to prepare it first
  # because it may contain characters that are not allowed in docker image tags
  docker-prepare-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - unit-tests
    outputs:
      tag: ${{ steps.docker-prepare-tag.outputs.tag }}
    steps:
      - name: Prepare Docker image tag
        id: docker-prepare-tag
        run: |
          IMAGE_TAG="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "$IMAGE_TAG"

  docker-build:
    uses: ./.github/workflows/140-docker-build.yaml
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    needs:
      - docker-prepare-tag
    with:
      runs_on: ubuntu-latest
      continue_on_error: false
      service_name: "go42"
      image_tag: ${{ needs.docker-prepare-tag.outputs.tag }}
      platforms: "linux/amd64,linux/arm64"
      attestation: ${{ github.ref == 'refs/heads/master' }}
      generate_sbom: true
      attestation_sbom: false
      timeout_minutes: 30

  # stage 5: post-build security scans

  # dummy job to create distinct group in GitHub UI
  security-extra-group:
    name: "Security Scans"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image_reference: ${{ needs.docker-build.outputs.image_reference }}
    needs:
      - docker-prepare-tag
      - docker-build
    steps:
      - name: Create security scans group
        run: echo "Grouping job for security scans"

  security-extra:
    uses: ./.github/workflows/140-security-extra.yaml
    permissions:
      contents: read
      packages: read
    needs:
      - security-extra-group
    with:
      runs_on: ubuntu-latest
      continue_on_error: true
      image_reference: ${{ needs.security-extra-group.outputs.image_reference }}
      timeout_minutes: 15

  # stage 6: integration, load & resilience tests

  # dummy job to create distinct group in GitHub UI
  functional-tests-group:
    name: "Functional Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image_reference: ${{ needs.docker-build.outputs.image_reference }}
    needs:
      - docker-prepare-tag
      - docker-build
    steps:
      - name: Create integration, load and resilience tests group
        run: echo "Grouping job for tests"

  integration-tests:
    uses: ./.github/workflows/150-integration-tests.yaml
    permissions:
      contents: read
      packages: read
    needs:
      - functional-tests-group
    with:
      runs_on: ubuntu-latest
      continue_on_error: false
      image_reference: ${{ needs.functional-tests-group.outputs.image_reference }}
      timeout_minutes: 10

  load-tests:
    uses: ./.github/workflows/150-load-tests.yaml
    permissions:
      contents: read
      packages: read
    needs:
      - functional-tests-group
    with:
      runs_on: ubuntu-latest
      continue_on_error: true
      image_reference: ${{ needs.functional-tests-group.outputs.image_reference }}
      timeout_minutes: 10

  # Reporting does not use the temporary image, so run it independently of cleanup.
  load-tests-report:
    if: ${{ !cancelled() && needs.load-tests.result != 'skipped' }}
    uses: ./.github/workflows/150-load-tests-report.yaml
    permissions:
      contents: read
    needs:
      - load-tests
    with:
      runs_on: ubuntu-latest
      timeout_minutes: 10

  resilience-tests:
    uses: ./.github/workflows/150-resilience-tests.yaml
    permissions:
      contents: read
    needs:
      - git-lint
      - golangci-lint
      - docker-lint
      - helm-lint
      - proto-lint
      - openapi-lint
      - markdown-lint
      - writing-lint
      - action-lint
      - sql-lint
      - project-lint
      - editorconfig-lint
    with:
      runs_on: ubuntu-latest
      continue_on_error: false
      timeout_minutes: 15

  # stage 7: cleanup

  cleanup:
    # Without a prepared tag no image could have been published; avoid an empty-tag API request.
    if: >-
      ${{ always() && needs.docker-prepare-tag.result == 'success' && needs.docker-prepare-tag.outputs.tag != '' }}
    uses: ./.github/workflows/160-cleanup.yaml
    permissions:
      contents: read
      packages: write
    needs:
      - docker-prepare-tag
      - security-extra
      - integration-tests
      - load-tests
    with:
      runs_on: ubuntu-latest
      service_name: "go42"
      image_tag: ${{ needs.docker-prepare-tag.outputs.tag }}
      timeout_minutes: 10

  # stage 8: required finish gate

  gate-finish:
    name: gate-finish
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - gate-start
      - security
      - integration-tests
      - resilience-tests
      - fuzz-tests
      - cleanup
      - load-tests-report
    steps:
      # Cleanup and load reporting are advisory, but waiting for them makes this the terminal workflow gate.
      - name: Require blocking jobs to succeed
        env:
          GATE_START_RESULT: ${{ needs.gate-start.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          INTEGRATION_RESULT: ${{ needs.integration-tests.result }}
          RESILIENCE_RESULT: ${{ needs.resilience-tests.result }}
          FUZZ_RESULT: ${{ needs.fuzz-tests.result }}
          CLEANUP_RESULT: ${{ needs.cleanup.result }}
          LOAD_TESTS_REPORT_RESULT: ${{ needs.load-tests-report.result }}
        run: |-
          echo "gate-start: $GATE_START_RESULT"
          echo "security: $SECURITY_RESULT"
          echo "integration-tests: $INTEGRATION_RESULT"
          echo "resilience-tests: $RESILIENCE_RESULT"
          echo "fuzz-tests: $FUZZ_RESULT"
          echo "cleanup (advisory): $CLEANUP_RESULT"
          echo "load-tests-report (advisory): $LOAD_TESTS_REPORT_RESULT"

          if [[ "$GATE_START_RESULT" != 'success' ]]; then
            echo "::error::Full CI did not start successfully."
            exit 1
          fi

          if [ "$SECURITY_RESULT" != "success" ] || \
            [ "$INTEGRATION_RESULT" != "success" ] || \
            [ "$RESILIENCE_RESULT" != "success" ] || \
            [ "$FUZZ_RESULT" != "success" ]; then
            echo "::error::One or more blocking CI branches did not succeed."
            exit 1
          fi
