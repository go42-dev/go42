---
name: project-lint
# Linter specific to current project.
# This workflow checks for uncommitted changes after running 'make generate'.
# It is used to ensure that the relevant generated files are committed to the repository.
on:
  workflow_call:
    inputs:
      runs_on:
        required: true
        type: string
      continue_on_error:
        required: true
        type: boolean
      timeout_minutes:
        required: false
        type: number
        default: 10
permissions: {}
jobs:
  project-lint:
    name: project-lint
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    # -----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # -----
      - name: 'Prepare project environment'
        uses: ./.github/actions/prepare-env
      # -----
      - name: 'Generate code'
        run: make generate
      - name: 'Check for uncommitted changes'
        run: |-
          if [[ -n $(git status --porcelain) ]]; then
            echo "Uncommitted changes detected after running 'make generate'"
            echo "The following files have changes:"
            git status --porcelain
            echo ""
            echo "Please run 'make setup && make generate' locally and commit the changes."
            exit 1
          else
            echo "No uncommitted changes detected"
          fi
