---

name: resilience-tests

# Resilience tests.
# Starts remote dependencies behind Toxiproxy and verifies startup, recovery,
# readiness, concurrency, and shutdown behavior during network failures.

on:
  workflow_call:
    inputs:
      runs_on:
        required: true
        type: string
      continue_on_error:
        required: true
        type: boolean
      timeout_minutes:
        required: false
        type: number
        default: 15

permissions: {}

jobs:
  resilience-tests:
    name: resilience-tests
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    # ----
    services:
      pgsql:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: qwerty
          POSTGRES_DB: go42
        options: >-
          --health-cmd "PGPASSWORD=qwerty psql -h localhost -U user -d go42 -c 'SELECT 1' || exit 1" --health-start-period
          10s --health-interval 5s --health-timeout 5s --health-retries 5
      mysql:
        image: mysql:26.7.0@sha256:66aec17cd21a956029b83f083b813073859e8355dc1a00e55df6ba02f0e32345
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
          MYSQL_USER: user
          MYSQL_PASSWORD: qwerty
          MYSQL_DATABASE: go42
        options: >-
          --health-cmd "mysql -h localhost -u user -pqwerty -D go42 -e 'SELECT 1' || exit 1" --health-start-period 30s --health-interval
          10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.10.1@sha256:298e5b3bc566bade82f46ad5511777a4a07a294097ce16ada2f6a42be5239df5
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      memcached:
        image: memcached:1.6.45@sha256:75c93cc91e76853da7c029e74d6e8dbd44774dd3713c93be8cd1971ad26120a4
      nats:
        image: nats:2.14.6@sha256:d4a8980c1ee558257f196f86693ec919c7a8b8095dd678e2cb5ff1adcfe03ecb
        command: -js -m 8222
      rabbitmq:
        image: rabbitmq:3.13.7-management@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
        env:
          RABBITMQ_DEFAULT_USER: user
          RABBITMQ_DEFAULT_PASS: qwerty
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-start-period 10s --health-interval 5s --health-timeout 5s --health-retries
          10
      kafka:
        image: apache/kafka:4.0.0@sha256:3f7b939115cd4872e9cee9369d80bd69712fde55f9902f46d793f64848dedc75
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: INTERNAL://:1001,EXTERNAL://:9092,RESILIENCE://:19093,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:1001,EXTERNAL://localhost:9092,RESILIENCE://localhost:19092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,RESILIENCE:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_NUM_PARTITIONS: 1
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      toxiproxy:
        image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
        ports:
          - 8474:8474
          - 15432:15432
          - 15433:15433
          - 13306:13306
          - 13307:13307
          - 16379:16379
          - 11212:11212
          - 14222:14222
          - 19092:19092
          - 15673:15673
    # ----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup Go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: 'Download Go modules'
        run: go mod download
      - name: 'Run resilience tests'
        run: |-
          mkdir -p build
          go build -race -o ./.build/resilience-app ./cmd/app
          RESILIENCE_APP_BINARY="${GITHUB_WORKSPACE}/.build/resilience-app" \
            go test -count=1 -v -race -tags=resilience ./tests/resilience/...
          go test -count=1 -v -tags=resilience ./tests/resilience/... -run '^TestRabbitMQ'
        env:
          CGO_ENABLED: 1 # needed for -race
          RESILIENCE_RABBITMQ_ADDRESS: amqp://user:qwerty@127.0.0.1:15673/
