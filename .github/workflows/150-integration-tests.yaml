---

name: integration-tests

# Integrations tests.
# Runs application, dependencies if necessary, and executes tests marked as integration tests.

on:
  workflow_call:
    inputs:
      runs_on:
        required: true
        type: string
      continue_on_error:
        required: true
        type: boolean
      image_reference:
        required: true
        type: string
      source_sha:
        required: false
        type: string
        default: ""
      timeout_minutes:
        required: false
        type: number
        default: 10

permissions: {}

jobs:
  integration-tests:
    name: integration-tests-${{ matrix.database }}
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        database:
          - sqlite
          - mysql
          - pgsql
        include:
          - database: sqlite
            database_engine: sqlite
            app_port: 44442
            grpc_port: 55552
          - database: mysql
            database_engine: mysql
            app_port: 44443
            grpc_port: 55553
          - database: pgsql
            database_engine: pgsql
            app_port: 44444
            grpc_port: 55554
    # ----
    services:
      mysql:
        image: >-
          ${{ matrix.database == 'mysql' && 'mysql:26.7.0@sha256:66aec17cd21a956029b83f083b813073859e8355dc1a00e55df6ba02f0e32345'
          || '' }}
        ports:
          - 3306:3306
        env:
          MYSQL_USER: user
          MYSQL_PASSWORD: qwerty
          MYSQL_DATABASE: go42
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd "mysql -h localhost -u user -pqwerty -D go42 -e 'SELECT 1' || exit 1" --health-start-period 30s --health-interval
          10s --health-timeout 5s --health-retries 10
      pgsql:
        image: >-
          ${{ matrix.database == 'pgsql' && 'postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280'
          || '' }}
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: qwerty
          POSTGRES_DB: go42
        options: >-
          --health-cmd "PGPASSWORD=qwerty psql -h localhost -U user -d go42 -c 'SELECT 1' || exit 1" --health-start-period
          10s --health-interval 5s --health-timeout 5s --health-retries 5
      app:
        image: ${{ inputs.image_reference }}
        ports:
          - ${{ matrix.app_port }}:8080 # unique ports to avoid conflicts on self-hosted runners
          - ${{ matrix.grpc_port }}:50051 # unique ports to avoid conflicts on self-hosted runners
        # environment variables read by service against which integration tests are run
        env:
          LOG_LEVEL: warn
          ENVIRONMENT: ci-integration-tests
          AUTH_RATE_LIMITER_ENABLED: false
          SERVER_HTTP_LISTEN: :8080
          SERVER_GRPC_LISTEN: :50051
          SERVER_GRPC_AUTHORIZATION_ENABLED: true
          DATABASE_ENGINE: ${{ matrix.database_engine }}
          DATABASE_MYSQL_MASTER_HOST: mysql
          DATABASE_MYSQL_SLAVE_HOST: mysql
          DATABASE_PGSQL_MASTER_HOST: pgsql
          DATABASE_PGSQL_SLAVE_HOST: pgsql
        options: >-
          --health-cmd "curl -f http://localhost:8080/health || exit 1" --health-start-period 1s --health-interval 5s --health-timeout
          5s --health-retries 10
    # ----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}
      - name: 'Validate checked-out source'
        if: inputs.source_sha != ''
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ || "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]]; then
            echo "Checkout did not resolve to the expected source commit" >&2
            exit 1
          fi
      - name: 'Setup Go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: 'Download Go modules'
        run: go mod download
      - name: 'Run integration tests'
        run: go test -count=1 -v -race ./tests/integration/...
        # environment variables read by integration tests
        env:
          CGO_ENABLED: 1 # needed for -race
          HTTP_SERVER_ADDRESS: http://localhost:${{ matrix.app_port }}
          GRPC_SERVER_ADDRESS: localhost:${{ matrix.grpc_port }}
          GRPC_API_KEY: api_kXqdf2uQ7hmOARp-pZrhA6_IsZSeKCmSEM4YFKBGIzA
