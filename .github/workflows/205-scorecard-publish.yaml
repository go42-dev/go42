---

name: scorecard-publish

# Publishes the master branch Scorecard result and uploads the same analysis
# to code scanning. OIDC is isolated here to satisfy Scorecard restrictions.

on:
  push:
    branches:
      - master

permissions: {}

concurrency:
  group: scorecard-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: scorecard-publish
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Run and publish OSSF Scorecard analysis'
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true
      - name: 'Upload Scorecard results to Security tab'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard-results.sarif
