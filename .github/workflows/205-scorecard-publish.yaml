---

name: scorecard-publish

# Publishes the master branch Scorecard result and uploads the same analysis
# to code scanning. OIDC is isolated here to satisfy Scorecard restrictions.

on:
  push:
    branches:
      - master

permissions: {}

concurrency:
  group: scorecard-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: scorecard-publish
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Run and publish OSSF Scorecard analysis'
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true
      - name: 'Upload Scorecard results to Security tab'
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: scorecard-results.sarif
