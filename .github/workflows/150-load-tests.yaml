---

name: load-tests

# Load tests.
# Simulates load on the application and uploads raw K6 results.
# Aggregate reporting is orchestrated separately so image cleanup does not wait for summary generation.

on:
  workflow_call:
    inputs:
      runs_on:
        required: true
        type: string
      continue_on_error:
        required: true
        type: boolean
      image_reference:
        required: true
        type: string
      timeout_minutes:
        required: false
        type: number
        default: 10

permissions: {}

jobs:
  load-tests:
    name: load-tests-${{ matrix.protocol }}-${{ matrix.database }}
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        protocol:
          - http
          - grpc
        database:
          - sqlite
          - mysql
          - pgsql
        include:
          # HTTP configurations
          - protocol: http
            database: sqlite
            app_port: 44441
            grpc_port: 55551
            test_path: ./tests/load/http/v1/auth_test.js
            env_name: ci-load-tests-http
            server_address_env: HTTP_SERVER_ADDRESS
            grpc_auth_enabled: true
          - protocol: http
            database: mysql
            app_port: 44442
            grpc_port: 55552
            test_path: ./tests/load/http/v1/auth_test.js
            env_name: ci-load-tests-http
            server_address_env: HTTP_SERVER_ADDRESS
            grpc_auth_enabled: true
          - protocol: http
            database: pgsql
            app_port: 44443
            grpc_port: 55553
            test_path: ./tests/load/http/v1/auth_test.js
            env_name: ci-load-tests-http
            server_address_env: HTTP_SERVER_ADDRESS
            grpc_auth_enabled: true
          # GRPC configurations
          - protocol: grpc
            database: sqlite
            app_port: 44444
            grpc_port: 55554
            test_path: ./tests/load/grpc/v1/auth_test.js
            env_name: ci-load-tests
            server_address_env: GRPC_SERVER_ADDRESS
            grpc_auth_enabled: true
          - protocol: grpc
            database: mysql
            app_port: 44445
            grpc_port: 55555
            test_path: ./tests/load/grpc/v1/auth_test.js
            env_name: ci-load-tests
            server_address_env: GRPC_SERVER_ADDRESS
            grpc_auth_enabled: true
          - protocol: grpc
            database: pgsql
            app_port: 44446
            grpc_port: 55556
            test_path: ./tests/load/grpc/v1/auth_test.js
            env_name: ci-load-tests
            server_address_env: GRPC_SERVER_ADDRESS
            grpc_auth_enabled: true
    services:
      mysql:
        image: >-
          ${{ matrix.database == 'mysql' && 'mysql:26.7.0@sha256:66aec17cd21a956029b83f083b813073859e8355dc1a00e55df6ba02f0e32345'
          || '' }}
        ports:
          - 3306:3306
        env:
          MYSQL_USER: user
          MYSQL_PASSWORD: qwerty
          MYSQL_DATABASE: go42
          MYSQL_ROOT_PASSWORD: qwerty
        options: >-
          --health-cmd "mysql -h localhost -u user -pqwerty -D go42 -e 'SELECT 1' || exit 1" --health-start-period 30s --health-interval
          10s --health-timeout 5s --health-retries 10
      pgsql:
        image: >-
          ${{ matrix.database == 'pgsql' && 'postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280'
          || '' }}
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: qwerty
          POSTGRES_DB: go42
        options: >-
          --health-cmd "PGPASSWORD=qwerty psql -h localhost -U user -d go42 -c 'SELECT 1' || exit 1" --health-start-period
          10s --health-interval 5s --health-timeout 5s --health-retries 5
      app:
        image: ${{ inputs.image_reference }}
        ports:
          - ${{ matrix.app_port }}:8080 # unique ports to avoid conflicts on self-hosted runners
          - ${{ matrix.grpc_port }}:50051 # unique ports to avoid conflicts on self-hosted runners
        env:
          LOG_LEVEL: warn
          ENVIRONMENT: ${{ matrix.env_name }}
          AUTH_RATE_LIMITER_ENABLED: false
          SERVER_HTTP_LISTEN: :8080
          SERVER_GRPC_LISTEN: :50051
          SERVER_GRPC_AUTHORIZATION_ENABLED: ${{ matrix.grpc_auth_enabled }}
          DATABASE_ENGINE: ${{ matrix.database }}
          DATABASE_MYSQL_MASTER_HOST: mysql
          DATABASE_MYSQL_SLAVE_HOST: mysql
          DATABASE_PGSQL_MASTER_HOST: pgsql
          DATABASE_PGSQL_SLAVE_HOST: pgsql
        options: >-
          --health-cmd "curl -f http://localhost:8080/health || exit 1" --health-start-period 1s --health-interval 5s --health-timeout
          5s --health-retries 10
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup K6'
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1
      - name: 'Run K6 load tests'
        uses: grafana/run-k6-action@de51a7390bdf0ac85a3bef493691bd71d4c7c158 # v1.4.0
        with:
          path: ${{ matrix.test_path }}
          flags: --summary-export=k6-summary-${{ matrix.protocol }}-${{ matrix.database }}-v1.json
        env:
          ${{ matrix.server_address_env }}: ${{ matrix.protocol == 'http' && format('http://localhost:{0}', matrix.app_port)
            || format('localhost:{0}', matrix.grpc_port) }}
          GRPC_API_KEY: api_kXqdf2uQ7hmOARp-pZrhA6_IsZSeKCmSEM4YFKBGIzA
      - name: 'Upload K6 test results'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k6-summary-${{ matrix.protocol }}-${{ matrix.database }}-v1
          path: k6-summary-${{ matrix.protocol }}-${{ matrix.database }}-v1.json
