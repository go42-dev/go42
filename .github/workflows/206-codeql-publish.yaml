---

name: codeql-publish

# Unified CI runs a read-only CodeQL check for every change. This isolated
# workflow analyzes and publishes every commit pushed to master.

on:
  push:
    branches:
      - master

permissions: {}

concurrency:
  group: codeql-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql-publish:
    name: codeql-publish
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: 'Checkout master commit'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Initialize CodeQL'
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: go
      - name: 'Build'
        uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      - name: 'Generate CodeQL results'
        id: codeql-analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          output: codeql-results
          upload: never
          upload-database: false
      - name: 'Publish CodeQL results to code scanning'
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: ${{ steps.codeql-analysis.outputs.sarif-output }}
          category: '.github/workflows/100-unified-workflow.yaml:codeql'
