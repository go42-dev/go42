---

name: docker-build

# Service packaging.
# Builds Dockerfile, which in turn builds golang binary.
# buildx allows building multi-arch images.
# Pushes image to ghcr.io.

on:
  workflow_call:
    outputs:
      image_digest:
        description: "Manifest digest of the pushed image"
        value: ${{ jobs.docker-build.outputs.image_digest }}
      image_reference:
        description: "Immutable reference of the pushed image"
        value: ${{ jobs.docker-build.outputs.image_reference }}
    inputs:
      runs_on:
        required: true
        type: string
      continue_on_error:
        required: true
        type: boolean
      service_name:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      source_sha:
        required: false
        type: string
        default: ""
      platforms:
        required: true
        type: string
      attestation:
        required: true
        type: boolean
      generate_sbom:
        required: true
        type: boolean
      attestation_sbom:
        required: true
        type: boolean
      timeout_minutes:
        required: false
        type: number
        default: 30

permissions: {}

jobs:
  # build image, pushes to ghcr.io and generates metadata
  docker-build:
    name: docker-build
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      image_digest: ${{ steps.validate-digest.outputs.image_digest }}
      image_reference: ${{ steps.validate-digest.outputs.image_reference }}
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
      actions: read
    # ----
    steps:
      - name: 'Validate image publication target'
        env:
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid OCI image tag: $IMAGE_TAG" >&2
            exit 1
          fi
          if [[ -n "$SOURCE_SHA" && ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid source commit SHA: $SOURCE_SHA" >&2
            exit 1
          fi

          # Version tags are permanent release aliases. Only the master-only
          # release workflow may create them. Bind publication to its exact
          # dispatch commit so another caller cannot replace a release image.
          if [[ "$IMAGE_TAG" == v* ]]; then
            expected_workflow_ref="${REPOSITORY}/.github/workflows/300-release.yaml@refs/heads/master"
            if [[ "$EVENT_NAME" != "workflow_dispatch" || "$EVENT_REF" != "refs/heads/master" || \
              "$CALLER_WORKFLOW_REF" != "$expected_workflow_ref" || \
              "$CALLER_WORKFLOW_SHA" != "$SOURCE_SHA" || "$EVENT_SHA" != "$SOURCE_SHA" ]]; then
              echo "Release image tags may only be published by the master release workflow" >&2
              exit 1
            fi
          fi
      # ----
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: 'Validate checked-out source'
        if: inputs.source_sha != ''
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]]; then
            echo "Checkout did not resolve to $SOURCE_SHA" >&2
            exit 1
          fi
      # ----
      - name: 'Extract Go version'
        run: echo "go_version=$(grep '^go ' go.mod | awk '{print $2}')" >> "$GITHUB_ENV"
      - name: 'Extract commit hash'
        run: echo "commit_hash=$(git rev-parse HEAD 2>/dev/null || echo '')" >> "$GITHUB_ENV"
      - name: 'Extract release tag'
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          release_tag=''
          if [[ "$IMAGE_TAG" == v* ]]; then
            release_tag="$IMAGE_TAG"
          else
            release_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_ENV"
      # ----
      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          cache-binary: true
      - name: 'Log in to GitHub Container Registry'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ----
      # For single platform builds `index` annotations will fail - check and set levels accordingly.
      - name: 'Determine annotation levels'
        id: annotations-levels
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          count=$(echo "$PLATFORMS" | awk -F',' '{print NF}')
          if [ "$count" -gt 1 ]; then
            echo "levels=manifest,index" >> "$GITHUB_OUTPUT"
          else
            echo "levels=manifest" >> "$GITHUB_OUTPUT"
          fi
      # Prepare tags, labels and annotations for the image.
      - name: 'Extract metadata'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ inputs.service_name }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
          # @see https://github.com/opencontainers/image-spec/blob/main/annotations.md
          labels: |
            org.opencontainers.image.title: ${{ inputs.service_name }}
            org.opencontainers.image.source: https://github.com/${{ github.repository_owner }}/${{ inputs.service_name }}
            org.opencontainers.image.url: https://github.com/${{ github.repository_owner }}/${{ inputs.service_name }}
            org.opencontainers.image.version: ${{ inputs.image_tag }}
            org.opencontainers.image.revision: ${{ env.commit_hash }}
            org.opencontainers.image.licenses: MIT
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: ${{ steps.annotations-levels.outputs.levels }}
      # ----
      - name: 'Build and push Docker image'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: ${{ github.workspace }}/
          file: ${{ github.workspace }}/Dockerfile
          platforms: ${{ inputs.platforms }}
          cache-from: type=gha
          # Cache export is an optimization, not a publication requirement.
          # A cache-service write failure must not cancel the image push.
          cache-to: type=gha,mode=max,ignore-error=true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GO_VERSION=${{ env.go_version }}
            COMMIT_HASH=${{ env.commit_hash }}
            RELEASE_TAG=${{ env.release_tag }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
        env:
          # This also will make images to show as created `55 years ago`.
          # @see https://reproducible-builds.org/docs/source-date-epoch/
          SOURCE_DATE_EPOCH: 0
          # @see https://github.com/orgs/community/discussions/45969
          BUILDX_NO_DEFAULT_ATTESTATIONS: true
      - name: 'Validate image digest'
        id: validate-digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/${{ inputs.service_name }}
        run: |
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid image digest: $IMAGE_DIGEST" >&2
            exit 1
          fi
          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "image_reference=${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
      # ----
      # Record provenance immediately after publication. Later SBOM processing
      # cannot leave a pushed image without a source/run identity attestation.
      - name: 'Attest build provenance'
        if: ${{ inputs.attestation }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ inputs.service_name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          show-summary: true
      # ----
      - name: 'Generate SBOM'
        if: ${{ inputs.generate_sbom }}
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          # Generate the SBOM from the immutable manifest that was just built,
          # not from a tag that another workflow could move concurrently.
          image: ghcr.io/${{ github.repository_owner }}/${{ inputs.service_name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ inputs.service_name }}-${{ inputs.image_tag }}.spdx.json
          artifact-name: sbom-${{ inputs.service_name }}-${{ inputs.image_tag }}.spdx.json
          # Go dependencies are already captured by GitHub's managed
          # Dependency Graph job.
          dependency-snapshot: false
          upload-artifact: true
      # ----
      - name: 'Attest SBOM'
        if: ${{ inputs.attestation_sbom }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ inputs.service_name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-${{ inputs.service_name }}-${{ inputs.image_tag }}.spdx.json
          show-summary: true
