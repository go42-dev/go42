---

name: github-pages

# This workflow builds the Docusaurus documentation and deploys it to GitHub Pages.

# When you configure a custom domain for GitHub Pages (via repository Settings → Pages → Custom domain),
# GitHub stores this information in a CNAME file in your repository, but it doesn't automatically
# create an Actions variable for it.

on:
  # push or merge to master
  push:
    branches:
      - master

permissions: {}

concurrency:
  group: "github-pages"
  queue: max
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    env:
      MISE_DEFAULT_CONFIG_FILENAME: etc/mise.toml
      MISE_DATA_DIR: ${{ github.workspace }}/.tools
      MISE_CACHE_DIR: ${{ github.workspace }}/.tools/cache
      MISE_STATE_DIR: ${{ github.workspace }}/.tools/state
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ----
      - name: 'Install pinned Node.js'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.9.1'
          install_args: --locked node
      # ----
      - name: 'Install dependencies'
        working-directory: pages
        run: npm ci
      - name: 'Build Docusaurus static files'
        working-directory: pages
        env:
          DOCUSAURUS_TITLE: ${{ github.event.repository.name }}
          DOCUSAURUS_URL: 'https://${{ github.repository_owner }}.github.io'
          DOCUSAURUS_BASE_URL: '/${{ github.event.repository.name }}/'
        run: npm run build
      # ----
      - name: 'Setup Pages'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          token: ${{ github.token }}
      - name: 'Upload artifact'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: 'github-pages'
          path: pages/build

  deploy:
    name: deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      pages: write
    needs: build
    steps:
      - name: 'Deploy to GitHub Pages'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: 'github-pages'
