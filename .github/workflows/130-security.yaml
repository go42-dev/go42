---

name: security

# Vulnerability / data leak detection.
# @see https://github.com/gitleaks/gitleaks
# @see https://github.com/securego/gosec
# @see https://pkg.go.dev/golang.org/x/vuln/cmd/govulncheck
# @see https://codeql.github.com/
# @see https://github.com/google/go-licenses
# @see https://github.com/ossf/scorecard
# @see https://github.com/google/capslock

on:
  workflow_call:
    inputs:
      runs_on:
        required: true
        type: string
      continue_on_error:
        required: true
        type: boolean
      timeout_minutes:
        required: false
        type: number
        default: 15
      codeql_timeout_minutes:
        required: false
        type: number
        default: 30

permissions: {}

jobs:

  gitleaks:
    name: gitleaks
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    # -----
    steps:
      - name: 'Checkout repository with full history'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 'Install pinned Gitleaks'
        uses: ./.github/actions/setup-tools
        with:
          install-args: --locked gitleaks
      - name: 'Run Gitleaks scan'
        shell: bash
        run: gitleaks git --config etc/gitleaks.toml --no-banner --redact -v

  gosec:
    name: gosec
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    # -----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup Go'
        uses: ./.github/actions/setup-go
      - name: 'Install pinned Gosec'
        uses: ./.github/actions/setup-tools
        with:
          install-args: --locked gosec
      - name: 'Run Gosec security scanner'
        shell: bash
        run: gosec -terse -exclude-generated ./...

  govulncheck:
    name: govulncheck
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    # -----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup Go'
        uses: ./.github/actions/setup-go
      - name: 'Install pinned govulncheck'
        uses: ./.github/actions/setup-tools
        with:
          install-args: --locked govulncheck
      # Match the production entry point and image build settings.
      - name: 'Run Go vulnerability check (linux/amd64)'
        shell: bash
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 govulncheck ./cmd/app
      - name: 'Run Go vulnerability check (linux/arm64)'
        shell: bash
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 govulncheck ./cmd/app

  codeql:
    name: codeql
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.codeql_timeout_minutes }}
    permissions:
      actions: read
      contents: read
      security-events: read
    # -----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup Go'
        uses: ./.github/actions/setup-go
      - name: 'Set up project tooling'
        uses: ./.github/actions/setup-tools
        with:
          # CodeQL uses Go without installing mise-managed tools.
          cache: false
      - name: 'Initialize CodeQL'
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: go
      - name: 'Build'
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      - name: 'Perform CodeQL analysis'
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: '.github/workflows/100-unified-workflow.yaml:codeql'
          upload: never
          upload-database: false
          output: ${{ runner.temp }}/codeql-results
      # Analysis stays read-only; fail on findings so pull requests are gated without upload access.
      - name: 'Fail on CodeQL findings'
        shell: bash
        env:
          SARIF_DIR: ${{ runner.temp }}/codeql-results
        run: |-
          set -euo pipefail
          shopt -s nullglob
          files=("$SARIF_DIR"/*.sarif)
          if [ "${#files[@]}" -eq 0 ]; then
            echo '::error::CodeQL produced no SARIF results to check.'
            exit 1
          fi
          filter='.runs[].results[]? | select((.suppressions // []) | length == 0)'
          jq -r "$filter"' | "::error file=\(.locations[0].physicalLocation.artifactLocation.uri),line=\(.locations[0].physicalLocation.region.startLine)::\(.ruleId): \(.message.text)"' "${files[@]}"
          count=$(jq -s "[.[] | $filter] | length" "${files[@]}")
          if [ "$count" -gt 0 ]; then
            echo "::error::CodeQL reported $count finding(s); fix them before merging."
            exit 1
          fi
          echo 'CodeQL reported no findings.'

  licenses:
    name: licenses
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    # -----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup Go'
        uses: ./.github/actions/setup-go
      - name: 'Install pinned go-licenses'
        uses: ./.github/actions/setup-tools
        with:
          install-args: --locked go-licenses
      - name: 'Check Go licenses'
        # Some packages may miss license files or link to external libraries.
        # Add `unknown` to disallowed_types for stricter checks.
        shell: bash
        run: go-licenses check --include_tests --confidence_threshold=0.9 --disallowed_types=forbidden,restricted ./...

  # Keep pull request analysis OIDC-free. Master publishing is isolated in
  # 205-scorecard-publish.yaml to satisfy the Scorecard workflow restrictions.
  scorecard:
    if: github.event_name == 'pull_request'
    name: scorecard
    runs-on: ubuntu-latest # MUST be hardcoded for OSSF scorecards
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    # ----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Run OSSF Scorecard analysis'
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false

  # run capslock only on non-master branches to determine difference
  # between the current branch and master branch in capabilities
  capslock:
    if: github.ref != 'refs/heads/master'
    name: capslock
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    # -----
    steps:
      - name: 'Checkout repository with full history'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 'Setup Go'
        uses: ./.github/actions/setup-go
      - name: 'Install pinned Capslock tools'
        uses: ./.github/actions/setup-tools
        with:
          install-args: --locked capslock
          # Rebuild the cached binaries when the project's Go version changes.
      - name: 'Report capability changes since master (advisory)'
        shell: bash
        run: task lint:capabilities
