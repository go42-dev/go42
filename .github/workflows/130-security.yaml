---

name: security

# Vulnerability / data leak detection.
# @see https://github.com/gitleaks/gitleaks
# @see https://github.com/securego/gosec
# @see https://pkg.go.dev/golang.org/x/vuln/cmd/govulncheck
# @see https://codeql.github.com/
# @see https://github.com/google/go-licenses
# @see https://github.com/ossf/scorecard
# @see https://github.com/google/capslock

on:
  workflow_call:
    inputs:
      runs_on:
        required: true
        type: string
      continue_on_error:
        required: true
        type: boolean
      timeout_minutes:
        required: false
        type: number
        default: 15
      codeql_timeout_minutes:
        required: false
        type: number
        default: 30

permissions: {}

jobs:

  gitleaks:
    name: gitleaks
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    env:
      MISE_DEFAULT_CONFIG_FILENAME: etc/mise.toml
      MISE_DATA_DIR: ${{ github.workspace }}/.tools
      MISE_CACHE_DIR: ${{ github.workspace }}/.tools/cache
      MISE_STATE_DIR: ${{ github.workspace }}/.tools/state
    # -----
    steps:
      - name: 'Checkout repository with full history'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 'Install pinned Gitleaks'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.9.1'
          install_args: --locked gitleaks
      - name: 'Run Gitleaks scan'
        shell: bash
        run: gitleaks git --config etc/gitleaks.toml --no-banner --redact -v

  gosec:
    name: gosec
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    env:
      MISE_DEFAULT_CONFIG_FILENAME: etc/mise.toml
      MISE_DATA_DIR: ${{ github.workspace }}/.tools
      MISE_CACHE_DIR: ${{ github.workspace }}/.tools/cache
      MISE_STATE_DIR: ${{ github.workspace }}/.tools/state
    # -----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup Go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: 'Install pinned Gosec'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.9.1'
          install_args: --locked go:github.com/securego/gosec/v2/cmd/gosec
          # Rebuild the cached binary when the project's Go version changes.
          cache_key_prefix: mise-gosec-v1-${{ hashFiles('go.mod') }}
      - name: 'Run Gosec security scanner'
        shell: bash
        run: gosec -terse -exclude-generated ./...

  govulncheck:
    name: govulncheck
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    env:
      MISE_DEFAULT_CONFIG_FILENAME: etc/mise.toml
      MISE_DATA_DIR: ${{ github.workspace }}/.tools
      MISE_CACHE_DIR: ${{ github.workspace }}/.tools/cache
      MISE_STATE_DIR: ${{ github.workspace }}/.tools/state
    # -----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup Go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: 'Install pinned govulncheck'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.9.1'
          install_args: --locked go:golang.org/x/vuln/cmd/govulncheck
          # Rebuild the cached binary when the project's Go version changes.
          cache_key_prefix: mise-govulncheck-v1-${{ hashFiles('go.mod') }}
      # Match the production entry point and image build settings.
      - name: 'Run Go vulnerability check (linux/amd64)'
        shell: bash
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 govulncheck ./cmd/app
      - name: 'Run Go vulnerability check (linux/arm64)'
        shell: bash
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 govulncheck ./cmd/app

  codeql:
    name: codeql
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.codeql_timeout_minutes }}
    permissions:
      actions: read
      contents: read
      security-events: read
    # -----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # -----
      - name: 'Initialize CodeQL'
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: go
      - name: 'Build'
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      - name: 'Perform CodeQL analysis'
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          upload: never
          upload-database: false

  licenses:
    name: licenses
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    env:
      MISE_DEFAULT_CONFIG_FILENAME: etc/mise.toml
      MISE_DATA_DIR: ${{ github.workspace }}/.tools
      MISE_CACHE_DIR: ${{ github.workspace }}/.tools/cache
      MISE_STATE_DIR: ${{ github.workspace }}/.tools/state
    # -----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup Go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: 'Install pinned go-licenses'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.9.1'
          install_args: --locked go:github.com/google/go-licenses
          # Rebuild the cached binary when the project's Go version changes.
          cache_key_prefix: mise-go-licenses-v1-${{ hashFiles('go.mod') }}
      - name: 'Check Go licenses'
        # Some packages may miss license files or link to external libraries.
        # Add `unknown` to disallowed_types for stricter checks.
        shell: bash
        run: go-licenses check --include_tests --confidence_threshold=0.9 --disallowed_types=forbidden,restricted ./...

  # Keep pull request analysis OIDC-free. Master publishing is isolated in
  # 205-scorecard-publish.yaml to satisfy the Scorecard workflow restrictions.
  scorecard:
    if: github.event_name == 'pull_request'
    name: scorecard
    runs-on: ubuntu-latest # MUST be hardcoded for OSSF scorecards
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    # ----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Run OSSF Scorecard analysis'
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false

  # run capslock only on non-master branches to determine difference
  # between the current branch and master branch in capabilities
  capslock:
    if: github.ref != 'refs/heads/master'
    name: capslock
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    env:
      MISE_DEFAULT_CONFIG_FILENAME: etc/mise.toml
      MISE_DATA_DIR: ${{ github.workspace }}/.tools
      MISE_CACHE_DIR: ${{ github.workspace }}/.tools/cache
      MISE_STATE_DIR: ${{ github.workspace }}/.tools/state
    # -----
    steps:
      - name: 'Checkout repository with full history'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 'Setup Go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: 'Install pinned Capslock tools'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.9.1'
          install_args: --locked go:github.com/google/capslock/cmd/...
          # Rebuild the cached binaries when the project's Go version changes.
          cache_key_prefix: mise-capslock-v1-${{ hashFiles('go.mod') }}
      - name: 'Check for capabilities added since master'
        shell: bash
        run: >-
          mise exec -- capslock-git-diff -granularity=package -capabilities= "$(git rev-parse origin/master)" . ./...
      - name: 'Check for capabilities removed since master'
        shell: bash
        run: >-
          mise exec -- capslock-git-diff -granularity=package -capabilities= . "$(git rev-parse origin/master)" ./...
