---

name: security

# Vulnerability / data leak detection.
# @see https://github.com/gitleaks/gitleaks
# @see https://github.com/securego/gosec
# @see https://pkg.go.dev/golang.org/x/vuln/cmd/govulncheck
# @see https://codeql.github.com/
# @see https://github.com/google/go-licenses
# @see https://github.com/ossf/scorecard
# @see https://github.com/google/capslock

on:
  workflow_call:
    inputs:
      runs_on:
        required: true
        type: string
      continue_on_error:
        required: true
        type: boolean
      timeout_minutes:
        required: false
        type: number
        default: 15
      codeql_timeout_minutes:
        required: false
        type: number
        default: 30
    secrets:
      GITLEAKS_LICENSE:
        description: "Gitleaks Action license for organization-owned repositories"
        required: false

permissions: {}

jobs:

  gitleaks:
    name: gitleaks
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    # -----
    steps:
      - name: 'Checkout repository with full history'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 'Run Gitleaks scan'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_CONFIG: etc/gitleaks.toml
          GITLEAKS_VERSION: 8.30.1

  gosec:
    name: gosec
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    # -----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Extract Go version'
        run: echo "go_version=$(grep '^go ' go.mod | awk '{print $2}')" >> "$GITHUB_ENV"
      - name: 'Run Gosec security scanner'
        uses: securego/gosec@598d6146b91b2370c6f11f7d3cb256119d8cbfc4 # master
        env:
          GO111MODULE: on # will download go modules
          GOSECGOVERSION: ${{ env.go_version }}
        with:
          args: -exclude-generated ./...

  govulncheck:
    name: govulncheck
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    # -----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup Go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false
      - name: 'Install govulncheck'
        # Keep in sync with etc/mise.toml.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: 'Run Go vulnerability check'
        # Match the production entry point built by Dockerfile.
        run: govulncheck ./cmd/app

  codeql:
    name: codeql
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.codeql_timeout_minutes }}
    permissions:
      actions: read
      contents: read
      security-events: read
    # -----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # -----
      - name: 'Initialize CodeQL'
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: go
      - name: 'Build'
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      - name: 'Perform CodeQL analysis'
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          upload: never
          upload-database: false

  licenses:
    name: licenses
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    # -----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Check Go licenses'
        uses: joeig/go-licenses-action@14ffdafa825ad1c78cb30af8d8cb8e242c2fd36e # v1.2
        with:
          # some packages may miss license files, or they are linked to outside libraries
          # for stricter checks, add `unknown` to this list
          disallowed-types: "forbidden,restricted"

  # Keep pull request analysis OIDC-free. Master publishing is isolated in
  # 205-scorecard-publish.yaml to satisfy the Scorecard workflow restrictions.
  scorecard:
    if: github.event_name == 'pull_request'
    name: scorecard
    runs-on: ubuntu-latest # MUST be hardcoded for OSSF scorecards
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    # ----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Run OSSF Scorecard analysis'
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false

  # run capslock only on non-master branches to determine difference
  # between the current branch and master branch in capabilities
  capslock:
    if: github.ref != 'refs/heads/master'
    name: capslock
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    # -----
    steps:
      - name: 'Checkout master branch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: master
      - name: 'Setup Go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: 'Install capslock'
        run: go install github.com/google/capslock/cmd/capslock@v0.3.3
      - name: 'Generate master branch capabilities'
        run: capslock -packages ./... -output=json > capabilities.json
      - name: 'Save master capabilities'
        run: mv capabilities.json /tmp/capabilities.json
      # -----
      - name: 'Checkout current branch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Compare capabilities with master'
        run: capslock -packages ./... -output=compare /tmp/capabilities.json
