---

name: cleanup

# Cleanup script.
# Deletes docker image used in unified workflow.

on:
  workflow_call:
    inputs:
      runs_on:
        required: true
        type: string
      service_name:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      timeout_minutes:
        required: false
        type: number
        default: 10

permissions: {}

jobs:
  cleanup:
    name: cleanup
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      packages: write
      contents: read
    steps:
      - name: 'Delete temporary Docker image'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: ${{ inputs.service_name }}
          TARGET_TAG: ${{ inputs.image_tag }}
        run: |-
          set -euo pipefail

          echo "Starting cleanup for $PACKAGE_NAME with tag: $TARGET_TAG"

          # This reusable workflow has package deletion permission. Restrict it
          # to the exact temporary-tag format produced by the unified workflow.
          if [[ ! "$TARGET_TAG" =~ ^ci-[1-9][0-9]*-[1-9][0-9]*$ ]]; then
            echo "Refusing to delete invalid or non-CI image tag: $TARGET_TAG"
            exit 1
          fi

          if [[ ! "$PACKAGE_NAME" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]]; then
            echo "Refusing invalid package name: $PACKAGE_NAME"
            exit 1
          fi

          owner_type=$(gh api "users/$OWNER" --jq '.type')
          case "$owner_type" in
            Organization) package_endpoint="orgs/$OWNER/packages/container/$PACKAGE_NAME" ;;
            User) package_endpoint="users/$OWNER/packages/container/$PACKAGE_NAME" ;;
            *)
              echo "Unsupported package owner type: $owner_type"
              exit 1
              ;;
          esac

          echo "Fetching all package versions..."
          versions=$(gh api --paginate "$package_endpoint/versions?per_page=100" | jq -s 'add // []')

          if ! printf '%s' "$versions" | jq -e '
            type == "array" and
            all(.[];
              (.id | type) == "number" and
              (.name | type) == "string" and
              (.metadata.container.tags | type) == "array" and
              all(.metadata.container.tags[]; type == "string")
            )
          ' >/dev/null; then
            echo "Package version response was incomplete or malformed"
            exit 1
          fi

          matches=$(printf '%s' "$versions" | jq --arg target "$TARGET_TAG" \
            '[.[] | select(any(.metadata.container.tags[]; . == $target))]')
          match_count=$(printf '%s' "$matches" | jq 'length')

          if [ "$match_count" -eq 0 ]; then
            echo "No version found with tag $TARGET_TAG"
            exit 0
          fi

          if [ "$match_count" -ne 1 ]; then
            echo "Refusing to delete: found $match_count versions with tag $TARGET_TAG"
            exit 1
          fi

          # Do not delete a manifest that is also reachable through another tag.
          if ! printf '%s' "$matches" | jq -e --arg target "$TARGET_TAG" \
            '([.[0].metadata.container.tags[]] | sort | unique) == [$target]' >/dev/null; then
            echo "Refusing to delete a version shared by another tag"
            exit 1
          fi

          version_id=$(printf '%s' "$matches" | jq -r '.[0].id')
          version_name=$(printf '%s' "$matches" | jq -r '.[0].name')

          # Re-read immediately before deletion to narrow the race in which a
          # previously safe candidate is concurrently retagged.
          current=$(gh api "$package_endpoint/versions/$version_id")
          if ! printf '%s' "$current" | jq -e \
            --argjson expected_id "$version_id" \
            --arg expected_name "$version_name" \
            --arg target "$TARGET_TAG" '
              .id == $expected_id and
              .name == $expected_name and
              ((.metadata.container.tags | sort | unique) == [$target])
            ' >/dev/null; then
            echo "Refusing to delete: the package version or its complete tag set changed"
            exit 1
          fi

          echo "Deleting CI image version $version_id..."
          if delete_error=$(gh api --method DELETE "$package_endpoint/versions/$version_id" 2>&1); then
            echo "Successfully deleted version with tag $TARGET_TAG (ID: $version_id)"
          elif [[ "$delete_error" == *"gh: You cannot delete the last tagged version of a package. You must delete the package instead. (HTTP 400)"* ]]; then
            echo "::warning::Retaining CI tag $TARGET_TAG: GHCR requires at least one tagged version in the package."
          else
            printf '%s\n' "$delete_error" >&2
            exit 1
          fi
