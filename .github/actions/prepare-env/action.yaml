---

name: prepare-env
description: 'Prepare the shared Go development environment'

inputs:
  setup-task:
    description: 'Task used to install project dependencies'
    required: false
    default: 'setup'

runs:
  using: composite
  steps:
    - name: 'Setup Go'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
        cache: true
        cache-dependency-path: |
          **/go.sum
          **/go.mod
    # -----
    - name: 'Install mise and pinned Task'
      uses: ./.github/actions/setup-tools
      with:
        cache-scope: ${{ inputs.setup-task }}
    # -----
    - name: 'Setup project dependencies'
      shell: bash
      env:
        PROJECT_SETUP_TASK: ${{ inputs.setup-task }}
      run: task "$PROJECT_SETUP_TASK"
