---

name: prepare-env
description: 'Prepare the shared Go development environment'

inputs:
  setup-task:
    description: 'Task used to install project dependencies'
    required: false
    default: 'setup'
  go-cache:
    description: 'Restore Go module and compilation caches when setup or callers build source'
    required: false
    default: 'true'
  go-cache-scope:
    description: 'Go compilation workload; module caches remain shared'
    required: false
    default: 'build'

runs:
  using: composite
  steps:
    - name: 'Setup Go'
      uses: ./.github/actions/setup-go
      with:
        cache: ${{ inputs.go-cache }}
        cache-scope: ${{ inputs.go-cache-scope }}
    # -----
    - name: 'Install mise and Task'
      uses: ./.github/actions/setup-tools
      with:
        setup-task: ${{ inputs.setup-task }}
