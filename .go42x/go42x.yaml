---

# yaml-language-server: $schema=go42x.schema.json

version: "1.0"

project:
  name: go42
  language: go
  description: 'Golang project operation blueprint.'
  tags:
    - go42
    - golang
    - blueprint
    - service
  metadata:
    repository: github.com/go42-dev/go42
    documentation-entrypoint: docs/README.md

# Environment variable names whose values should appear in the shared context.
env: []

# Shared instructions for every enabled provider, rendered once to AGENTS.md.
# The chunk directory is relative to .go42x; immediate *.tpl.md files load in filename order.
context:
  template: agents.tpl.md
  chunks-dir: 'chunks/'
  # Directory for intermediate agent outputs; relative paths use the project root.
  # Omitted or empty defaults to .build. Templates use .context.TempDir.
  temp-dir: .build
  # Extra go env variables, e.g. [GOFLAGS, GOPRIVATE]. Values appear in shared context.
  # Defaults: GOVERSION, GOTOOLCHAIN, GOROOT, GOPATH, GOBIN, GOCACHE, GOMODCACHE,
  # GOMOD, GOWORK, GOOS, GOARCH, CGO_ENABLED. Empty values are omitted.
  go-env: []

# Generation makes all tools from enabled MCP servers available and updates tool approvals.
# auto-approve-tools configures native tool approvals for Claude and Crush.
# Other existing settings are preserved; defaults fill only missing fields.
# Set enabled: false to skip a provider; omitted enabled defaults to true.
# Keep shared defaults disabled; enable your providers in ignored go42x.local.yaml.
# --providers or GO42X_PROVIDERS selects an exact list for generate and doctor.
# Disabling preserves existing settings, including with --clean.
# Shared AGENTS.md is still generated when all providers are disabled.
providers:
  # -------------------------
  #          Claude
  # -------------------------
  claude:
    enabled: false
    auto-approve-tools:
      - Agent
      - AskUserQuestion
      - Bash
      - Edit
      - Glob
      - Grep
      - NotebookEdit
      - Read
      - Skill
      - TaskCreate
      - TaskGet
      - TaskList
      - TaskUpdate
      - TaskStop
      - WebFetch
      - WebSearch
      - Write

  # -------------------------
  #           Codex
  # -------------------------
  codex:
    enabled: false
    # Omit to preserve the existing approval policy. Sandbox settings are preserved.
    approval-policy: on-request
    # Approval mode for every enabled MCP server: auto, prompt, writes, or approve.
    mcp-approval: approve

  # -------------------------
  #        Antigravity
  # -------------------------
  # Project MCP tools are packaged in .agents/plugins/project-tools/.
  # Tool approvals are managed in Antigravity user settings.
  antigravity:
    enabled: false

  # -------------------------
  #           Crush
  # -------------------------
  crush:
    enabled: false
    auto-approve-tools:
      - view
      - ls
      - grep
      - glob
      - edit
      - write
      - multiedit
      - bash

  # -------------------------
  #      Github Copilot
  # -------------------------
  # All MCP tools are available. Tool approvals are managed in Copilot's user settings.
  copilot:
    enabled: false

mcp:
  # All tools from enabled servers are available, including tools omitted from these lists.
  # Lists use raw tool names for context descriptions and client approval settings.
  # Set enabled: false to disable a server.
  # Optional cwd is a literal path for stdio servers; relative paths use the project directory.
  # Codex, Antigravity, and Copilot support cwd. Enabled Claude or Crush providers reject it.
  # Omit cwd to use the client's default working directory.
  gopls:
    enabled: true
    type: stdio
    name: gopls
    command: task
    args:
      - tool
      - --
      - gopls
      - mcp
    tools:
      - go_diagnostics
      - go_file_context
      - go_package_api
      - go_rename_symbol
      - go_search
      - go_symbol_references
      - go_vulncheck
      - go_workspace

  go42x:
    enabled: true
    type: stdio
    name: go42x
    command: task
    args:
      - tool
      - --
      - go42x
      - mcp
    tools:
      - project_context
      - docs_get
      - docs_impact
      - kwb_get_file
      - kwb_list_files
      - kwb_search
      - kwb_stats

  mise:
    enabled: true
    type: stdio
    name: mise
    command: task
    args:
      - tool
      - --
      - mise
      - mcp
    tools:
      - list_commands
      - run_task

  context7:
    enabled: true
    type: http
    name: context7
    url: https://mcp.context7.com/mcp
    headers:
      Authorization: "Bearer ${CONTEXT7_API_KEY}"
    tools:
      - resolve-library-id
      - query-docs

  github:
    enabled: true
    type: http
    name: github
    url: https://api.githubcopilot.com/mcp/
    headers:
      Authorization: "Bearer ${GITHUB_PERSONAL_ACCESS_TOKEN}"
      X-MCP-Toolsets: all
    tools:
