---

# yaml-language-server: $schema=https://raw.githubusercontent.com/go42-dev/go42x/0c8673d6f9ee2b7f41cf5857c58a2490005bd93a/assets/agentenv/schemas/go42x.schema.yaml

version: "1.0"

# Variable substitution is supported in configuration string values.
# Example: IJ_MCP_SERVER_PROJECT_PATH: '${GO42X_PROJECT_ROOT}' in mcp.jetbrains.headers.
#
# Supported substitutions:
# - ${GO42X_PROJECT_ROOT}: absolute path to the project directory.

project:
  name: go42
  language: go
  description: 'Golang project operation blueprint.'
  repository: github.com/go42-dev/go42
  documentation-entrypoint: docs/README.md
  tags:
    - go42
    - golang
    - blueprint
    - service

# Environment variable names whose values should appear in the shared context.
env: []

# Shared instructions for every enabled provider, rendered once to AGENTS.md.
context:
  template: agents.tpl.md
  # Instruction chunks, relative to .go42x: immediate *.tpl.md files load in filename order.
  # Name project chunks 999-<name>.tpl.md: they load after the bundled chunks, which never
  # use 999. Omit to include no chunks.
  chunks-dir: 'chunks/'
  # Agent skills, relative to .go42x: one subdirectory per skill with a SKILL.md, or with
  # a SKILL.tpl.md to render the skill's *.tpl.md files as templates with chunk data.
  # Generation installs them in the skill directories of enabled providers: .claude/skills
  # for Claude, .agents/skills for Codex and Antigravity, and both for gh-aw,
  # whose workflows may run any engine. Omit to install no skills.
  skills-dir: 'skills/'
  # Temporary files of go42x and agents, relative to .go42x. Omitted or empty defaults to
  # tmp. Templates use .context.TmpPath.
  tmp-dir: 'tmp/'
  # Extra go env variables, e.g. [GOFLAGS, GOPRIVATE]. Values appear in shared context.
  # Defaults: GOVERSION, GOTOOLCHAIN, GOROOT, GOPATH, GOBIN, GOCACHE, GOMODCACHE,
  # GOMOD, GOWORK, GOOS, GOARCH, CGO_ENABLED. Empty values are omitted.
  go-env: []

# Agent task journal. Templates use .journal.Dir for the journal directory.
journal:
  # Journal directory, relative to .go42x.
  path: 'journal/'
  # Days an entry may go without an update before journal gc removes it, unless kept.
  retention-days: 30

# Generation makes all tools from enabled MCP servers available and updates tool approvals.
# auto-approve-tools configures native tool approvals for Claude and Crush.
# Other existing settings are preserved; defaults fill only missing fields.
# Set enabled: false to skip a provider; omitted enabled defaults to true.
# Keep shared defaults disabled; enable your providers in ignored go42x.local.yaml.
# --providers or GO42X_PROVIDERS selects an exact list for generate and doctor.
# --no-local skips go42x.local.yaml; use it when generating shared workflows.
# Disabling preserves existing settings, including with --clean.
# Shared AGENTS.md is still generated when all providers are disabled.
providers:
  # -------------------------
  #          Claude
  # -------------------------
  claude:
    enabled: false
    auto-approve-tools:
      - Agent
      - AskUserQuestion
      - Bash
      - Edit
      - Glob
      - Grep
      - NotebookEdit
      - Read
      - Skill
      - TaskCreate
      - TaskGet
      - TaskList
      - TaskUpdate
      - TaskStop
      - WebFetch
      - WebSearch
      - Write

  # -------------------------
  #           Codex
  # -------------------------
  codex:
    enabled: false
    # Maximum instruction bytes. Omit to preserve the existing Codex setting.
    project-doc-max-bytes: 65536
    # Omit to preserve the existing approval policy. Sandbox settings are preserved.
    approval-policy: on-request
    # Approval mode for every enabled MCP server: auto, prompt, writes, or approve.
    mcp-approval: approve

  # -------------------------
  #        Antigravity
  # -------------------------
  # Project MCP tools are packaged in .agents/plugins/project-tools/.
  # Antigravity asks before running an MCP tool unless its permission rules, such as mcp(server/tool),
  # allow it: Settings > General > Global Permissions, or per project under Settings > Projects.
  antigravity:
    enabled: false

  # -------------------------
  #           Crush
  # -------------------------
  crush:
    enabled: false
    auto-approve-tools:
      - view
      - ls
      - grep
      - glob
      - edit
      - write
      - multiedit
      - bash

  # -------------------------
  # GitHub Agentic Workflows
  # -------------------------
  # Generates .github/workflows/900-aw-mcp.md for import before gh-aw compilation.
  gh-aw:
    enabled: false
    # MCP servers that agentic workflows get, whether or not they are enabled below for local
    # agents. Instructions generated for gh-aw describe them too.
    mcp-servers:
      - go42x
      - gopls
      - mise
      - context7
      - github
    # Map ${NAME} references to explicit workflow values; missing bindings fail generation.
    # Keep GitHub ${{ ... }} expressions here. Bindings never read the local environment.
    bindings:
      CONTEXT7_API_KEY: '${{ secrets.CONTEXT7_API_KEY }}'
      GITHUB_TOKEN: '${{ github.token }}'
      GITLAB_TOKEN: '${{ secrets.GITLAB_TOKEN }}'
      MCP_IMAGE_VERSION: '${{ env.GO42X_MCP_IMAGE_VERSION }}'
      PROJECT_DIR: '${{ github.workspace }}'
      SLACK_USER_TOKEN: '${{ secrets.SLACK_USER_TOKEN }}'

mcp:
  # All tools from enabled servers are available, including tools omitted from these lists.
  # Lists use raw tool names for context descriptions and client approval settings.
  # Set enabled: false to disable a server for local agents; gh-aw uses its own mcp-servers list.
  # Antigravity resolves $NAME and ${NAME} in remote headers during generation.
  # Export these variables before generating; resolved headers stay in ignored plugin output.
  # Optional cwd is a literal path for stdio servers; relative paths use the project directory.
  # Codex and Antigravity support cwd. Enabled Claude, Crush, or gh-aw providers reject it.
  # Omit cwd to use the client's default working directory.
  # Optional container settings are used by gh-aw; other providers use command and args.
  go42x:
    enabled: true
    type: stdio
    name: go42x
    command: task
    args:
      - x
      - --
      - mcp
    container:
      image: ghcr.io/go42-dev/go42x
      version: '${MCP_IMAGE_VERSION}'
      command: go42x
      args:
        - mcp
      workdir: '${PROJECT_DIR}'
      mounts:
        - '${PROJECT_DIR}:${PROJECT_DIR}:rw'
    tools:
      - project_context
      - docs_get
      - docs_impact
      - kwb_get_file
      - kwb_list_files
      - kwb_search
      - kwb_stats
      - journal_list
      - journal_show
      - journal_new
      - journal_note
      - journal_attach
      - journal_search

  gopls:
    enabled: false
    type: stdio
    name: gopls
    command: task
    args:
      - tool
      - --
      - gopls
      - mcp
    container:
      image: ghcr.io/go42-dev/go42x
      version: '${MCP_IMAGE_VERSION}'
      command: gopls
      args:
        - mcp
      workdir: '${PROJECT_DIR}'
      mounts:
        - '${PROJECT_DIR}:${PROJECT_DIR}:rw'
    tools:
      - go_diagnostics
      - go_file_context
      - go_package_api
      - go_rename_symbol
      - go_search
      - go_symbol_references
      - go_vulncheck
      - go_workspace

  mise:
    enabled: false
    type: stdio
    name: mise
    command: task
    args:
      - tool
      - --
      - mise
      - mcp
    container:
      image: ghcr.io/go42-dev/go42x
      version: '${MCP_IMAGE_VERSION}'
      command: mise
      args:
        - mcp
      workdir: '${PROJECT_DIR}'
      mounts:
        - '${PROJECT_DIR}:${PROJECT_DIR}:rw'
      env:
        MISE_DEFAULT_CONFIG_FILENAME: etc/mise.toml
        MISE_TRUSTED_CONFIG_PATHS: '${PROJECT_DIR}/etc/mise.toml'
    tools:
      - list_commands
      - run_task

  context7:
    enabled: false
    type: http
    name: context7
    url: https://mcp.context7.com/mcp
    headers:
      Authorization: "Bearer ${CONTEXT7_API_KEY}"
    tools:
      - resolve-library-id
      - query-docs

  # Requires a running JetBrains IDE with this project open.
  # Set the URL from Settings > Tools > MCP Server; the project path resolves automatically.
  # Override the URL in ignored go42x.local.yaml before enabling locally.
  # Keep disabled for CI; see https://www.jetbrains.com/help/go/mcp-server.html.
  jetbrains:
    enabled: false
    type: http
    name: jetbrains
    url: http://127.0.0.1:64422/stream
    headers:
      IJ_MCP_SERVER_PROJECT_PATH: '${GO42X_PROJECT_ROOT}'
    tools:
      - get_file_problems
      - lint_files

  github:
    enabled: false
    type: http
    name: github
    url: https://api.githubcopilot.com/mcp/
    headers:
      Authorization: "Bearer ${GITHUB_TOKEN}"
      X-MCP-Toolsets: all
    tools:
      - actions_get
      - actions_list
      - actions_run_trigger
      - add_comment_to_pending_review
      - add_issue_comment
      - add_reply_to_pull_request_comment
      - create_branch
      - create_gist
      - create_or_update_file
      - create_pull_request
      - create_repository
      - create_repository_ruleset
      - custom_properties_read
      - custom_properties_write
      - delete_file
      - discussion_comment_write
      - dismiss_notification
      - fork_repository
      - get_code_quality_finding
      - get_code_scanning_alert
      - get_commit
      - get_dependabot_alert
      - get_discussion
      - get_discussion_comments
      - get_file_contents
      - get_gist
      - get_global_security_advisory
      - get_job_logs
      - get_label
      - get_latest_release
      - get_me
      - get_notification_details
      - get_release_by_tag
      - get_repository_tree
      - get_secret_scanning_alert
      - get_tag
      - get_team_members
      - get_teams
      - issue_read
      - issue_write
      - label_write
      - list_branches
      - list_code_scanning_alerts
      - list_commits
      - list_dependabot_alerts
      - list_discussion_categories
      - list_discussions
      - list_gists
      - list_global_security_advisories
      - list_issue_fields
      - list_issue_types
      - list_issues
      - list_label
      - list_notifications
      - list_org_repository_security_advisories
      - list_pull_requests
      - list_releases
      - list_repository_collaborators
      - list_repository_security_advisories
      - list_secret_scanning_alerts
      - list_starred_repositories
      - list_tags
      - manage_notification_subscription
      - manage_repository_notification_subscription
      - mark_all_notifications_read
      - merge_pull_request
      - projects_get
      - projects_list
      - projects_write
      - pull_request_read
      - pull_request_review_write
      - push_files
      - repository_ruleset_read
      - request_copilot_review
      - search_code
      - search_commits
      - search_issues
      - search_orgs
      - search_pull_requests
      - search_repositories
      - search_users
      - star_repository
      - sub_issue_write
      - unstar_repository
      - update_gist
      - update_pull_request
      - update_pull_request_branch

  # Official GitLab MCP server, GitLab 19.5 or later. The token must be a fine-grained personal
  # access token with the MCP tool resource and the Execute permission; legacy personal, project,
  # and group access tokens are rejected. An administrator allows MCP access for the top-level
  # group on GitLab.com, or for the instance. Set the URL to your instance for self-managed GitLab.
  # The list covers the default toolsets: core, merge_requests, work_items, repository, and ci.
  gitlab:
    enabled: false
    type: http
    name: gitlab
    url: https://gitlab.com/api/v4/mcp
    headers:
      Authorization: "Bearer ${GITLAB_TOKEN}"
    tools:
      - get_project
      - save_project
      - get_user
      - get_group
      - list_groups
      - list_projects
      - list_project_members
      - list_todos
      - list_user_events
      - list_milestones
      - save_note
      - search
      - search_labels
      - semantic_search
      - get_pages_content
      - save_merge_request
      - get_merge_request
      - list_merge_requests
      - save_merge_request_review
      - accept_merge_request
      - apply_suggestion
      - get_work_item
      - get_work_item_types
      - link_work_items
      - get_saved_view_work_items
      - list_work_item_saved_views
      - save_work_item
      - list_work_items
      - add_branch
      - fork_repository
      - list_branches
      - get_repository_file
      - list_repository_tree
      - get_commit
      - list_commits
      - list_releases
      - list_tags
      - add_commit
      - get_pipeline
      - get_job
      - get_artifact_file
      - list_pipelines
      - list_pipeline_schedules
      - save_pipeline
      - save_pipeline_job

  # Primary Jira and Confluence tools plus discovery/execution for the deferred catalog.
  # Available tools depend on the authenticated Atlassian account and scopes.
  jira:
    enabled: false
    type: http
    name: jira
    url: https://mcp.atlassian.com/v2/mcp
    tools:
      - atlassianUserInfo
      - getAccessibleAtlassianResources
      - discover
      - executeRead
      - executeWrite
      - executeDestructive
      - getJiraIssue
      - createJiraIssue
      - editJiraIssue
      - transitionJiraIssue
      - addOrEditJiraIssueComment
      - searchJiraIssuesUsingJql
      - getConfluenceContent
      - searchConfluence
      - createConfluenceContent
      - updateConfluenceContent

  # Official Slack MCP server. Slack documents OAuth through a registered Slack app, internal or
  # published in the Slack Marketplace, that a workspace admin approves; it supports no dynamic
  # client registration. Set SLACK_USER_TOKEN to a user token (xoxp-) of that app with the scopes
  # of the tools you use, such as search:read.public and chat:write. Slack does not document
  # sending the token directly, so check the connection before relying on it.
  slack:
    enabled: false
    type: http
    name: slack
    url: https://mcp.slack.com/mcp
    headers:
      Authorization: "Bearer ${SLACK_USER_TOKEN}"
    tools:
      - slack_search_public
      - slack_search_public_and_private
      - slack_search_channels
      - slack_search_users
      - slack_search_emojis
      - slack_read_channel
      - slack_read_thread
      - slack_read_user_profile
      - slack_list_user_channels
      - slack_list_channel_members
      - slack_read_file
      - slack_send_message
      - slack_send_message_draft
      - slack_schedule_message
      - slack_create_conversation
      - slack_add_reaction
      - slack_get_reactions
      - slack_get_file_upload_url
      - slack_complete_file_upload
      - slack_create_canvas
      - slack_read_canvas
      - slack_update_canvas
      - slack_create_list
      - slack_read_list
      - slack_update_list
      - slack_add_list_record
      - slack_update_list_record
