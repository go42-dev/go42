---
$schema: http://json-schema.org/draft-07/schema#
$id: https://github.com/go42-dev/go42x/agentenv/schema/v1.0
title: AgentEnv Configuration Schema
description: Schema for .go42x/go42x.yaml. String values support ${GO42X_PROJECT_ROOT}, resolved to the absolute project root
  after local overrides merge and before validation. Keys and runtime expressions remain unchanged.
type: object
required:
  - version
  - project
  - context
  - providers
definitions:
  providerEnabled:
    type: boolean
    description: Whether to generate configuration for this provider. Disabling preserves existing settings, including with
      --clean. Shared AGENTS.md is always generated.
    default: true
  autoApproveTools:
    type: array
    description: Native tool approval rules; does not filter tool availability
    items:
      type: string
      pattern: \S
  toolApprovalProvider:
    type: object
    properties:
      enabled:
        $ref: '#/definitions/providerEnabled'
      auto-approve-tools:
        $ref: '#/definitions/autoApproveTools'
    additionalProperties: false
allOf:
  - if:
      properties:
        providers:
          anyOf:
            - required:
                - claude
              properties:
                claude:
                  properties:
                    enabled:
                      const: true
            - required:
                - crush
              properties:
                crush:
                  properties:
                    enabled:
                      const: true
            - required:
                - gh-aw
              properties:
                gh-aw:
                  properties:
                    enabled:
                      const: true
    then:
      properties:
        mcp:
          additionalProperties:
            if:
              properties:
                enabled:
                  const: true
              required:
                - enabled
            then:
              properties:
                cwd:
                  const: ""
properties:
  version:
    type: string
    description: Supported configuration format version
    const: "1.0"
    examples:
      - "1.0"
  project:
    type: object
    description: Project metadata
    required:
      - name
    properties:
      name:
        type: string
        description: Project name
        minLength: 1
      language:
        type: string
        description: Primary programming language
        examples:
          - go
          - python
          - javascript
          - typescript
          - rust
      description:
        type: string
        description: Project description
      repository:
        type: string
        description: Canonical project repository, independent of the checkout's Git remote
        examples:
          - github.com/go42-dev/go42
      documentation-entrypoint:
        type: string
        description: Project-relative Markdown documentation entrypoint; omitted or empty uses the default
        default: docs/README.md
        examples:
          - docs/README.md
          - handbook/index.md
      tags:
        type: array
        description: Project tags
        items:
          type: string
      metadata:
        type: object
        description: Additional project metadata
        additionalProperties:
          type: string
  env:
    type: array
    description: Environment variable names whose values should appear in the generated shared context
    items:
      type: string
  context:
    type: object
    description: Shared instructions rendered to AGENTS.md; Claude imports this file and other providers read it directly.
    required:
      - template
    additionalProperties: false
    properties:
      template:
        type: string
        description: Template file path
        minLength: 1
      chunks-dir:
        type: string
        description: Chunk directory relative to .go42x; immediate *.tpl.md files load in filename order. Name project chunks
          999-<name>.tpl.md; bundled chunks never use that prefix. Omit to include no chunks.
      skills-dir:
        type: string
        description: Agent skill directory relative to .go42x; each immediate subdirectory with a SKILL.md, or with a SKILL.tpl.md
          whose *.tpl.md files render as templates, is installed in the skill directories of enabled providers. Omit to install
          no skills.
      tmp-dir:
        type: string
        description: Directory for temporary files of go42x and agents, relative to .go42x, available as .context.TmpPath
          from the project root. Omit or leave empty to use tmp. It must not start with a dot, use a directory or file that
          go42x keeps in .go42x, or overlap the journal.
        default: tmp
        pattern: ^$|\S
        not:
          pattern: "^[/.]|\\\\|\0|:|(^|/)\\.\\.(/|$)"
      go-env:
        type: array
        description: Additional go env variables published under golang.env, beyond GOVERSION, GOTOOLCHAIN, GOROOT, GOPATH,
          GOBIN, GOCACHE, GOMODCACHE, GOMOD, GOWORK, GOOS, GOARCH, CGO_ENABLED. Empty values are omitted.
        items:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
  journal:
    type: object
    description: Agent task journal. Local commands read and write it; in CI, the generated 901-aw-journal.md workflow import
      restores and saves it when the JOURNAL_REPOSITORY variable names a journal repository.
    additionalProperties: false
    properties:
      path:
        type: string
        description: Journal directory relative to .go42x, available as .journal.Dir. Omit to use journal. It must not start
          with a dot or use a directory or file that go42x keeps in .go42x.
        default: journal
        minLength: 1
        not:
          pattern: "^[/.]|\\\\|\0|:|(^|/)\\.\\.(/|$)"
      retention-days:
        type: integer
        description: Days an entry may go without an update before journal gc removes it, unless the entry is kept.
        default: 30
        minimum: 1
  providers:
    type: object
    description: AI provider configurations
    minProperties: 1
    additionalProperties: false
    properties:
      claude:
        type: object
        properties:
          enabled:
            $ref: '#/definitions/providerEnabled'
          agents:
            type: array
            description: Agent templates
            items:
              type: string
          auto-approve-tools:
            $ref: '#/definitions/autoApproveTools'
        additionalProperties: false
      codex:
        type: object
        properties:
          enabled:
            $ref: '#/definitions/providerEnabled'
          project-doc-max-bytes:
            type: integer
            minimum: 0
            description: Maximum project instruction bytes written to Codex config.toml. Omit to preserve the existing setting.
          approval-policy:
            type: string
            description: Codex command approval policy. Omit to preserve the existing policy. Does not change sandbox settings.
            enum:
              - on-request
              - never
          mcp-approval:
            type: string
            description: Default tool approval mode for every enabled MCP server. Omit to use the client's default. Does not
              filter tool availability.
            enum:
              - auto
              - prompt
              - writes
              - approve
        additionalProperties: false
      antigravity:
        type: object
        description: Workspace project-tools plugin with all enabled MCP servers. Antigravity asks before running an MCP tool
          unless its permission rules, such as mcp(server/tool), allow it.
        properties:
          enabled:
            $ref: '#/definitions/providerEnabled'
        additionalProperties: false
      crush:
        $ref: '#/definitions/toolApprovalProvider'
      gh-aw:
        type: object
        description: Importable MCP Markdown fragment for GitHub Agentic Workflows. Workflow configuration remains repository-owned.
        properties:
          enabled:
            $ref: '#/definitions/providerEnabled'
          mcp-servers:
            type: array
            description: MCP servers that agentic workflows get, whether or not they are enabled for local agents. Instructions
              generated for gh-aw describe them too.
            uniqueItems: true
            items:
              type: string
              minLength: 1
          bindings:
            type: object
            description: Explicit replacements for $NAME and ${NAME} in MCP values. Native GitHub expressions are preserved;
              missing bindings fail generation. Built-ins in binding values resolve before provider bindings. Values are copied
              without reading the local environment.
            propertyNames:
              pattern: ^[A-Za-z_][A-Za-z0-9_]*$
            additionalProperties:
              type: string
              pattern: \S
        additionalProperties: false
  mcp:
    type: object
    description: MCP (Model Context Protocol) server configurations
    additionalProperties:
      type: object
      required:
        - name
      properties:
        enabled:
          type: boolean
          description: Whether this MCP server is enabled
          default: false
        type:
          type: string
          description: Server connection type
          enum:
            - stdio
            - http
            - sse
          default: stdio
        name:
          type: string
          description: Server name
          minLength: 1
        url:
          type: string
          description: Server URL (for http/sse types)
          format: uri
        command:
          type: string
          description: Command to execute (for stdio type)
          minLength: 1
        args:
          type: array
          description: Command arguments
          items:
            type: string
        container:
          type: object
          description: Optional container execution for this stdio server. Currently used by gh-aw; other providers retain
            command and args.
          required:
            - image
            - command
          properties:
            image:
              type: string
              minLength: 1
            version:
              type: string
            command:
              type: string
              minLength: 1
            args:
              type: array
              items:
                type: string
            workdir:
              type: string
            mounts:
              type: array
              items:
                type: string
            env:
              type: object
              description: Environment values overriding shared stdio settings for this container.
              additionalProperties:
                type: string
          additionalProperties: false
        env:
          type: object
          description: Environment variables for the server
          additionalProperties:
            type: string
        tools:
          type: array
          description: Known raw MCP tool names for context descriptions and client approval settings, without a client or
            server prefix. All tools from enabled servers remain available, including tools omitted from this list.
          items:
            type: string
            pattern: ^[A-Za-z0-9_.-]+$
            not:
              pattern: ^mcp__
            maxLength: 128
          uniqueItems: true
        headers:
          type: object
          description: HTTP headers (for http/sse types). Antigravity resolves $NAME and ${NAME} from the generation environment
            and stores the values in its local plugin output. Missing or empty variables fail generation.
          additionalProperties:
            type: string
        cwd:
          type: string
          description: Working directory for stdio servers after built-in substitution. Relative paths resolve from the project
            directory; omit or leave empty for the client's default. Supported by Codex and Antigravity; rejected on enabled
            servers when Claude or Crush is enabled. Environment variables and home expansion are not supported.
          pattern: ^$|\S
          not:
            pattern: "\0"
          anyOf:
            - not:
                pattern: "\\$(?:[A-Za-z_]|\\{|\\()|%[A-Za-z_][A-Za-z0-9_]*%|^~"
            - pattern: '\$\{GO42X_[A-Za-z0-9_]+\}'
      allOf:
        - if:
            properties:
              type:
                const: stdio
          then:
            required:
              - command
        - if:
            properties:
              type:
                enum:
                  - http
                  - sse
            required:
              - type
          then:
            not:
              required:
                - container
            required:
              - url
            properties:
              cwd:
                const: ""
