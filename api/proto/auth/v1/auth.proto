syntax = "proto3";

package auth.v1;

import "google/protobuf/timestamp.proto";
import "third_party/buf/validate/validate.proto";

option go_package = "github.com/go42-dev/go42/api/gen/sdk/grpc/auth/v1";

message User {
  string uuid = 2;
  string email = 3;
  UserStatus status = 4;
  repeated string roles = 5;
  repeated string permissions = 6;
  bool is_system = 7;
  google.protobuf.Timestamp created_at = 8;
}

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_INACTIVE = 2;
}

message ListUsersRequest {
  int32 limit = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  int32 offset = 2 [(buf.validate.field).int32.gte = 0];
}

message ListUsersResponse {
  repeated User users = 1;
}

message GetUserByUUIDRequest {
  string uuid = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message GetUserByUUIDResponse {
  User user = 1;
}

message CreateUserRequest {
  // The service trims surrounding whitespace, lowercases, then validates the email.
  string email = 1 [(buf.validate.field).required = true];
  // At least 8 Unicode characters and at most 72 UTF-8 bytes; strength is checked by the service.
  string password = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 8,
    (buf.validate.field).string.max_bytes = 72
  ];
}

message CreateUserResponse {
  User user = 1;
}

message UpdateUserRequest {
  string uuid = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  optional string email = 2;
  optional string password = 3 [
    (buf.validate.field).string.min_len = 8,
    (buf.validate.field).string.max_bytes = 72
  ];
}

message UpdateUserResponse {}

message DeleteUserRequest {
  string uuid = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message DeleteUserResponse {}

service AuthService {
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc GetUserByUUID(GetUserByUUIDRequest) returns (GetUserByUUIDResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
}
