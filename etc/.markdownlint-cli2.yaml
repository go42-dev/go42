---

config:
  # Reference:
  #   https://github.com/DavidAnson/markdownlint/blob/main/schema/.markdownlint.yaml
  default: true

  # https://github.com/DavidAnson/markdownlint/blob/v0.38.0/doc/md034.md
  MD034: false

  # Website metadata supplies a title; keep a visible H1 for readers in a checkout.
  MD025:
    front_matter_title: ""

  # https://github.com/DavidAnson/markdownlint/blob/v0.38.0/doc/md013.md
  MD013:
    line_length: 120
    heading_line_length: 120
    code_block_line_length: 120
    tables: false # Allow aligned tables to exceed line length limit.

globs:
  - docs/**/*.md

gitignore: true
