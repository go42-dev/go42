min_version = "2026.9.1"

[settings]
lockfile = true
# Installation is explicit: make setup, setup-linters, or setup-generators.
exec_auto_install = false

[env]
GOTOOLCHAIN = "local"
REDOCLY_SUPPRESS_UPDATE_NOTICE = "true"
REDOCLY_TELEMETRY = "false"

[tools]
# Go is installed separately at the version declared in go.mod.
node = "26.7.0"
python = "3.14.7"
uv = "0.12.10"

# Linters and formatters. Keep the versions already used by CI.
actionlint = "1.7.12"
buf = "1.55.0"
editorconfig-checker = "3.11.3"          # The release binary is named ec.
"go:github.com/daixiang0/gci" = "0.14.0"
gitleaks = "8.30.1"
golangci-lint = "2.13.2"
golines = "0.13.0"
# Same revision as the existing Gosec CI job.
"go:github.com/securego/gosec/v2/cmd/gosec" = "v2.29.1-0.20260904090110-598d6146b91b"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.7.0"
hadolint = "2.15.1"
helm = "4.2.4"
"go:github.com/caarlos0/jsonfmt" = "0.5.2"
markdownlint-cli2 = "0.23.2"
"npm:@redocly/cli" = "2.51.2"
"github:oasdiff/oasdiff" = "1.31.0"
"pipx:sqlfluff" = { version = "4.3.0", uvx_args = "--python python" }
vale = "3.18.0"
"go:github.com/google/yamlfmt/cmd/yamlfmt" = "0.21.0"
zizmor = "1.30.0"

# Generators: preserve the versions used for the committed generated code.
"go:go.uber.org/mock/mockgen" = "0.6.0"
oapi-codegen = "2.8.0"
"go:github.com/ogen-go/ogen/cmd/ogen" = "1.24.0"
# Build Protobuf plugins with the project Go SDK to preserve generated formatting.
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "1.36.12"
"go:google.golang.org/grpc/cmd/protoc-gen-go-grpc" = "1.6.2"
yq = "4.53.6"

# Development tools.
"go:github.com/go-delve/delve/cmd/dlv" = "1.27.1"
"go:github.com/go42-dev/go42x" = "0.19.1"
jq = "1.8.2"
k6 = "2.2.0"

# MCP is installed separately with make setup-mcp.
"go:golang.org/x/tools/gopls" = { version = "0.23.0", lazy = true, lazy_bins = [
  "gopls",
] }
