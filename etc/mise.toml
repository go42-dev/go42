min_version = "2026.10.21"

[settings]
lockfile = true
exec_auto_install = false
disable_update_warning = true

[env]
REDOCLY_SUPPRESS_UPDATE_NOTICE = "true"
REDOCLY_TELEMETRY = "false"

[tool_alias]
capslock = "go:github.com/google/capslock/cmd/..."
commitlint = "npm:@commitlint/cli"
commitlint-config-conventional = "npm:@commitlint/config-conventional"
dlv = "aqua:go-delve/delve"
gci = "go:github.com/daixiang0/gci"
gh-aw = "github:github/gh-aw"
go-licenses = "go:github.com/google/go-licenses"
go42x = "github:go42-dev/go42x"
gopls = "go:golang.org/x/tools/gopls"
gosec = "aqua:securego/gosec"
govulncheck = "go:golang.org/x/vuln/cmd/govulncheck"
jsonfmt = "github:caarlos0/jsonfmt"
nilaway = "go:go.uber.org/nilaway/cmd/nilaway"
oasdiff = "github:oasdiff/oasdiff"
protoc-gen-go-grpc = "aqua:grpc/grpc-go/protoc-gen-go-grpc"
pyflakes = "pipx:pyflakes"
redocly = "npm:@redocly/cli"
sqlfluff = "pipx:sqlfluff"
yamlfmt = "aqua:google/yamlfmt"

[tools]
node = "26.7.0"
python = "3.14.7"
uv = "0.12.10"
yq = "4.53.6"
jq = "1.8.2"
k6 = "2.2.0"
actionlint = "1.7.12"
buf = "1.55.0"
editorconfig-checker = "3.11.3"
gitleaks = "8.30.1"
golangci-lint = "2.14.0"
golines = "0.13.0"
hadolint = "2.15.1"
helm = "4.2.4"
markdownlint-cli2 = "0.23.2"
shellcheck = "0.11.0"
tombi = "1.5.4"
vale = "3.18.0"
zizmor = "1.31.1"
commitlint = "19.2.1"
commitlint-config-conventional = "19.1.0"
redocly = "2.51.2"
pyflakes = "3.4.0"
sqlfluff = "4.3.0"
oasdiff = "1.31.0"
govulncheck = "1.7.0"
capslock = "0.3.3"
go-licenses = "1.6.0"
yamlfmt = "0.21.0"
gci = "0.14.0"
nilaway = "v0.0.0-20260808063849-8649a03c818a"
gosec = "2.30.0"
protoc-gen-go-grpc = "1.6.2"
dlv = "1.27.2"
gopls = "0.24.0"
jsonfmt = "0.5.2"
gh-aw = { version = "0.93.5", bin = "gh-aw" }
go42x = "0.52.0"
